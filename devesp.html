<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;touch-action:pan-x pan-y;}
html,body{height:100%;background:#0a0e1a;font-family:'Inter',sans-serif;overflow-x:hidden;}
body{overscroll-behavior:none;-webkit-overscroll-behavior:none;}
.container{max-width:1400px;margin:0 auto;padding:20px;}
.card{background:rgba(18,18,31,0.9);backdrop-filter:blur(10px);border-radius:20px;margin-bottom:20px;overflow:hidden;border:1px solid rgba(59,130,246,0.2);}
.card-header{padding:14px 20px;background:linear-gradient(135deg,#0f2b44,#071a2c);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.card-header .header-left{display:flex;align-items:center;gap:12px;}
.refresh-fiches-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:16px;transition:all 0.3s ease;flex-shrink:0;}
.refresh-fiches-btn:hover{background:rgba(255,255,255,0.25);transform:rotate(45deg);}
.refresh-fiches-btn:active{transform:rotate(90deg);}
.refresh-fiches-btn.spinning{animation:spin 0.8s ease-in-out;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.school-header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:20px;padding:14px 20px;text-align:center;margin-bottom:20px;cursor:pointer;}
.school-name{font-size:22px;font-weight:700;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.school-sub{font-size:11px;opacity:0.8;margin-top:4px;color:#cbd5e1;}
.tabs-container{overflow-x:auto;margin-bottom:20px;white-space:nowrap;-webkit-overflow-scrolling:touch;}
.tabs{display:inline-flex;gap:6px;}
.tab{background:transparent;border:1px solid #334155;padding:9px 20px;border-radius:40px;font-size:13px;cursor:pointer;color:#cbd5e1;transition:all 0.2s;}
.tab:hover{background:rgba(59,130,246,0.2);border-color:#3b82f6;}
.tab.active{background:#1e3a5f;color:#fff;border-color:transparent;}
.tab-content{display:none;animation:fadeIn 0.25s;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.main-nav{display:flex;gap:12px;margin-bottom:20px;background:rgba(18,18,31,0.9);border-radius:20px;padding:8px;border:1px solid rgba(59,130,246,0.2);overflow:hidden;}
.main-nav-btn{flex:1;padding:14px 20px;border-radius:16px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s ease;background:transparent;color:#94a3b8;font-family:'Inter',sans-serif;text-align:center;}
.main-nav-btn:hover{background:rgba(59,130,246,0.1);}
.main-nav-btn.active{background:linear-gradient(135deg,#1e3a5f,#0f2b44);color:#fff;box-shadow:0 4px 15px rgba(59,130,246,0.3);}
.main-nav-btn[data-space="titulaire"].active{background:linear-gradient(135deg,#1a3a2a,#0f2b1a);box-shadow:0 4px 15px rgba(16,185,129,0.3);}
.space-content{display:none;}
.space-content.active{display:block;animation:fadeIn 0.3s ease;}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:768px){.form-grid{grid-template-columns:repeat(3,1fr)}}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field label{font-size:11px;font-weight:600;color:#cbd5e1;}
.form-field input,.form-field select{background:#2d3748;border:1px solid #334155;border-radius:12px;padding:10px 14px;color:#fff;}
.form-field input:focus,.form-field select:focus{outline:none;border-color:#3b82f6;}
.hidden-field{display:none !important;}
.field-required label::after{content:" *";color:#ef4444;}
.field-optional label::after{content:" (facultatif)";color:#94a3b8;font-size:10px;font-weight:normal;}
.btn{background:#1e3a5f;color:#fff;border:none;padding:10px 20px;border-radius:40px;font-weight:500;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:all 0.2s;}
.btn:hover{opacity:0.9;transform:scale(0.98);}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn-outline{background:transparent;border:1.5px solid #3b82f6;color:#3b82f6;}
.btn-outline:hover{background:#3b82f6;color:#fff;}
.btn-danger{background:#7f1d1d;}
.btn-danger:hover{background:#991b1b;}
.btn-success{background:#14532d;}
.btn-success:hover{background:#166534;}
.btn-secondary{background:#334155;}
.btn-secondary:hover{background:#475569;}
.btn-primary{background:#1e3a5f;}
.btn-primary:hover{background:#0f2b44;}
.btn-warning{background:#b45309;color:#fff;}
.btn-warning:hover{background:#c2410c;}
.table-wrapper{overflow-x:auto;touch-action:pan-x pan-y;}
.student-table{width:100%;border-collapse:collapse;font-size:12px;min-width:1400px;}
.student-table th{background:#0f172a;padding:12px 6px;border-bottom:2px solid #334155;font-size:11px;color:#fff;}
.student-table td{border-bottom:1px solid #334155;padding:8px 4px;color:#e2e8f0;}
.student-table input{width:55px;padding:6px;border-radius:8px;background:#2d3748;border:1px solid #334155;color:#fff;text-align:center;}
.student-table input.note-insuffisant{color:#ef4444;}
.student-table input.note-moyen{color:#f59e0b;}
.student-table input.note-bien{color:#22c55e;}
.student-table input.note-excellent{color:#22c55e;}
.footer-note{text-align:center;padding:12px;font-size:11px;color:#4a5568;}
.fiche-selector{background:rgba(18,18,31,0.9);margin:0;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid rgba(59,130,246,0.2);}
.fiche-selector label{color:#fff;}
.fiche-selector select{flex:1;padding:8px 12px;border-radius:14px;background:#2d3748;border:1px solid #334155;color:#fff;}
.modal-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all 0.2s;}
.modal-fullscreen.show{visibility:visible;opacity:1;}
.modal-content{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:32px;width:90%;max-width:95vw;padding:24px;border:1px solid rgba(59,130,246,0.3);max-height:90vh;overflow-y:auto;}
.modal-content h3{font-size:18px;margin-bottom:16px;color:#fff;font-weight:600;}
.modal-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid #334155;padding-bottom:12px;flex-wrap:wrap;}
.modal-tab{background:transparent;border:none;padding:8px 16px;border-radius:30px;cursor:pointer;color:#94a3b8;font-size:13px;transition:all 0.2s;}
.modal-tab.active{background:#1e3a5f;color:#fff;}
.modal-tab-content{display:none;}
.modal-tab-content.active{display:block;}
.modal-content input,.modal-content select,.modal-content textarea{width:100%;padding:12px;border-radius:12px;background:#2d3748;border:1px solid #334155;color:#fff;margin:8px 0;}
.prof-list-item{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #334155;flex-wrap:wrap;gap:12px;background:rgba(0,0,0,0.2);border-radius:12px;margin-bottom:8px;}
.prof-info{flex:2;min-width:180px;}
.prof-name{font-weight:700;font-size:16px;color:#fff;margin-bottom:6px;}
.prof-date{font-size:12px;color:#94a3b8;}
.prof-actions{display:flex;gap:8px;}
.toast-container{position:fixed;top:20px;right:20px;z-index:30000;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.toast-notification{background:rgba(18,25,45,0.95);backdrop-filter:blur(12px);border-radius:16px;padding:18px 24px;min-width:340px;max-width:380px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);border-left:4px solid #10b981;transform:translateX(400px);transition:transform 0.3s ease;pointer-events:auto;}
.toast-notification.show{transform:translateX(0);}
.toast-notification.error{border-left-color:#ef4444;}
.toast-notification.warning{border-left-color:#f59e0b;}
.toast-icon{font-size:18px;}
.toast-content{flex:1;}
.toast-title{font-weight:700;font-size:16px;color:#fff;margin-bottom:4px;}
.toast-message{font-size:14px;color:#cbd5e1;line-height:1.4;}
.empty-state{text-align:center;padding:40px;color:#94a3b8;}
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);z-index:10000;display:flex;align-items:center;justify-content:center;}
.login-card{background:rgba(18,18,31,0.95);border-radius:32px;padding:32px;width:90%;max-width:400px;text-align:center;border:1px solid rgba(59,130,246,0.3);}
.login-card h2{font-size:22px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px;}
.login-card .subtitle{color:#94a3b8;font-size:13px;margin-bottom:20px;}
.login-card input,.login-card select{width:100%;padding:12px 16px;margin-bottom:14px;border-radius:40px;background:#2d3748;border:1px solid #334155;color:#fff;font-size:14px;}
.login-card select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");background-repeat:no-repeat;background-position:right 16px center;background-size:14px;padding-right:40px !important;}
.login-card .select-wrapper{position:relative;width:100%;}
.login-card .select-wrapper .select-label{position:absolute;top:-10px;left:16px;background:#0f172a;padding:0 6px;font-size:10px;color:#94a3b8;font-weight:600;z-index:1;}
.login-card button{width:100%;padding:12px;border-radius:40px;background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;font-weight:600;border:none;cursor:pointer;font-size:15px;transition:opacity 0.2s;}
.login-card button:hover{opacity:0.9;}
.eleve-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.eleve-row input{flex:2;padding:8px;border-radius:12px;background:#2d3748;border:1px solid #334155;color:#fff;}
.eleve-row select{padding:8px;border-radius:12px;background:#2d3748;border:1px solid #334155;color:#fff;}
.epreuve-box{background:rgba(45,55,72,0.6);border-radius:16px;padding:12px;margin-bottom:12px;}
.epreuve-list{display:flex;flex-wrap:wrap;gap:8px;}
.epreuve-item{display:flex;align-items:center;gap:8px;background:#2d3748;padding:6px 12px;border-radius:40px;}
.epreuve-item input{background:#1e293b;border:1px solid #334155;color:#fff;padding:4px 8px;border-radius:20px;}
.prof-config{background:rgba(45,55,72,0.4);border-radius:16px;padding:16px;margin-top:16px;border:1px solid #334155;}
.prof-config h3{font-size:13px;margin-bottom:12px;color:#fff;}
.prof-config .note-max-row{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:15px;}
.prof-config .note-max-row label{color:#cbd5e1;font-size:12px;}
.prof-config .note-max-row input{width:100px;padding:8px;border-radius:12px;background:#2d3748;color:#fff;border:1px solid #334155;}
.prof-config .btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.pedagogie-section{background:linear-gradient(135deg,rgba(18,25,45,0.95),rgba(10,15,30,0.95));border-radius:20px;overflow:hidden;border:1px solid rgba(59,130,246,0.3);}
.section-header{background:linear-gradient(135deg,#1e3a5f,#0f2b44);padding:14px 20px;font-weight:700;color:#fff;font-size:15px;display:flex;align-items:center;gap:10px;}
.pedagogie-controls{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px;}
.pedagogie-number-input{width:90px;padding:10px 12px;border-radius:40px;background:#1e293b;border:1px solid #334155;color:#fff;text-align:center;font-size:14px;}
.pedagogie-presence-list{background:#0f172a;border-radius:16px;padding:12px;max-height:200px;overflow-y:auto;margin-bottom:12px;}
.presence-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-bottom:1px solid #1e293b;}
.presence-item:last-child{border-bottom:none;}
.presence-item input[type="checkbox"]{width:20px;height:20px;cursor:pointer;accent-color:#3b82f6;}
.presence-item label{flex:1;color:#e2e8f0;font-size:13px;cursor:pointer;font-weight:500;}
.pedagogie-buttons-group{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.equipes-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:20px;}
.equipe-card{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:14px;padding:12px;border-left:3px solid #3b82f6;}
.equipe-title{font-weight:700;color:#60a5fa;font-size:13px;margin-bottom:10px;}
.equipe-members{list-style:none;padding-left:0;max-height:120px;overflow-y:auto;}
.equipe-members li{padding:5px 0;color:#cbd5e1;font-size:11px;border-bottom:1px dashed #1e293b;}
.grade-group-container{background:#0f172a;border-radius:16px;padding:12px;max-height:280px;overflow-y:auto;}
.grade-group-item{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px;border-bottom:1px solid #1e293b;}
.grade-group-item:last-child{border-bottom:none;}
.grade-group-info{flex:2;min-width:120px;}
.grade-group-name{font-weight:600;color:#60a5fa;font-size:13px;}
.grade-group-count{font-size:10px;color:#94a3b8;}
.grade-group-input{width:100px;padding:8px 10px;border-radius:40px;background:#1e293b;border:1px solid #334155;color:#fff;text-align:center;}
.horaire-list-container{background:#0f172a;border-radius:16px;overflow:hidden;}
.horaire-item{display:flex;align-items:center;gap:12px;background:#0f172a;padding:14px 16px;border-bottom:1px solid #1e293b;cursor:pointer;transition:background 0.2s;}
.horaire-item:last-child{border-bottom:none;}
.horaire-item:hover{background:#1e293b;}
.horaire-numero{font-weight:bold;color:#60a5fa;min-width:80px;font-size:14px;}
.horaire-info-hidden{flex:1;color:#cbd5e1;font-size:13px;text-align:center;}
.horaire-pause{opacity:0.6;cursor:default;}
.horaire-pause:hover{background:#0f172a;}
.horaire-config-item{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.horaire-config-item select,.horaire-config-item input{padding:6px 10px;border-radius:8px;background:#2d3748;border:1px solid #334155;color:#fff;}
.titulaire-container .bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;background:linear-gradient(135deg,#0a0e1a 0%,#0f172a 50%,#1a2335 100%);}
.titulaire-container .bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(circle at 20% 30%, rgba(59,130,246,0.06), transparent 70%);}
.titulaire-container .container-titu{max-width:100%;margin:0;padding:0 16px;}
.titulaire-container .config-card{background:rgba(18,18,31,0.9);backdrop-filter:blur(10px);border-radius:28px;padding:28px;border:1px solid rgba(59,130,246,0.2);}
.titulaire-container .config-card h2{font-size:20px;margin-bottom:8px;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;}
.titulaire-container .config-card p{font-size:13px;color:#94a3b8;margin-bottom:24px;}
.titulaire-container .config-card input{width:100%;padding:14px 18px;margin-bottom:20px;border-radius:60px;border:1px solid rgba(59,130,246,0.3);background:rgba(0,0,0,0.3);color:white;font-size:14px;outline:none;}
.titulaire-container .classes-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;max-height:450px;overflow-y:auto;padding:8px;border:1px solid rgba(59,130,246,0.2);border-radius:20px;background:rgba(0,0,0,0.2);}
.titulaire-container .class-item{display:block;padding:12px 16px;background:rgba(255,255,255,0.03);border-radius:16px;margin-bottom:8px;}
.titulaire-container .class-header{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;}
.titulaire-container .class-header input[type="checkbox"]{width:20px;height:20px;cursor:pointer;accent-color:#3b82f6;}
.titulaire-container .class-header label{flex:1;cursor:pointer;font-size:14px;font-weight:600;color:#e2e8f0;}
.titulaire-container .options-list{padding-left:32px;display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
.titulaire-container .option-item{display:flex;align-items:center;gap:8px;background:rgba(59,130,246,0.1);padding:6px 12px;border-radius:30px;}
.titulaire-container .option-item input{width:18px;height:18px;cursor:pointer;accent-color:#3b82f6;}
.titulaire-container .option-item label{font-size:12px;cursor:pointer;color:#cbd5e1;}
.titulaire-container .option-toutes{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);}
.titulaire-container .no-options-msg{padding-left:32px;font-size:11px;color:#10b981;font-style:italic;margin-top:6px;}
.titulaire-container .fiche-card{background:rgba(18,18,31,0.9);backdrop-filter:blur(10px);border-radius:24px;margin-bottom:24px;overflow-x:auto;border:1px solid rgba(59,130,246,0.15);}
.titulaire-container .fiche-header{background:linear-gradient(135deg,#0f2b44,#071a2c);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.titulaire-container .fiche-header h3{font-size:16px;font-weight:700;color:#ffd700;display:flex;align-items:center;gap:8px;}
.titulaire-container .fiche-header h3::before{content:"📘";font-size:18px;}
.titulaire-container .fiche-header .ref{font-size:10px;opacity:0.7;background:rgba(0,0,0,0.3);padding:4px 12px;border-radius:40px;font-family:monospace;color:#94a3b8;}
.titulaire-container .fiche-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:12px 20px;background:rgba(0,0,0,0.2);border-bottom:1px solid rgba(59,130,246,0.1);font-size:11px;}
.titulaire-container .fiche-info-item{display:flex;align-items:center;gap:8px;}
.titulaire-container .fiche-info-item .label{color:#94a3b8;font-weight:500;}
.titulaire-container .fiche-info-item .value{color:white;font-weight:600;}
.titulaire-container .student-table{width:100%;border-collapse:collapse;font-size:12px;}
.titulaire-container .student-table th{background:linear-gradient(135deg,#1e293b,#0f172a);color:white;padding:12px 8px;border-bottom:2px solid #3b82f6;font-size:11px;font-weight:600;text-align:center;}
.titulaire-container .student-table td{padding:10px 8px;border-bottom:1px solid rgba(59,130,246,0.1);color:#e2e8f0;text-align:center;}
.titulaire-container .student-table tr:hover td{background:rgba(59,130,246,0.05);}
.titulaire-container .student-table td:first-child{font-weight:600;color:#60a5fa;}
.titulaire-container .student-table td:nth-child(2){text-align:left;font-weight:500;}
.titulaire-container .note-cell{font-weight:600;}
.titulaire-container .total-s1{background:rgba(30,58,95,0.5);font-weight:700;color:#ffd700;}
.titulaire-container .total-s2{background:rgba(30,58,95,0.5);font-weight:700;color:#ffd700;}
.titulaire-container .total-final{background:rgba(92,74,26,0.5);font-weight:800;color:#fbbf24;}
.titulaire-container .fiche-actions{padding:16px 20px;border-top:1px solid rgba(59,130,246,0.15);display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;}

function getMoisActuel() {
const date = new Date();
const mois = date.getMonth();
const moisListe = ["Septembre", "Octobre", "Novembre", "Decembre", "Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin"];
if (mois === 7) {
return "Aout";
}
if (mois >= 8) return moisListe[mois - 8];
else if (mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function getMoisFromDate(dateISO) {
if (!dateISO) return "Septembre";
const date = new Date(dateISO);
const mois = date.getMonth();
const moisListe = ["Septembre", "Octobre", "Novembre", "Decembre", "Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin"];
if (mois === 7) return "Aout";
if (mois >= 8) return moisListe[mois - 8];
else if (mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function estMoisDansAnnee(mois) {
const moisActuel = getMoisActuel();
const moisListe = ["Septembre", "Octobre", "Novembre", "Decembre", "Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin"];
const idx = moisListe.indexOf(mois);
const idxActuel = moisListe.indexOf(moisActuel);
if(idxActuel === -1) return false;
return idx <= idxActuel;
}

function getWeekNumber(date) {

d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
const week1 = new Date(d.getFullYear(), 0, 4);
return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function getDataHash(eleveData) {
if (!eleveData) return null;
const dataStr = JSON.stringify({
nom: eleveData.nom,
prenom: eleveData.prenom,
sexe: eleveData.sexe,
classe: eleveData.classe,
notes: eleveData.notes,
frais: eleveData.frais,
punitions: eleveData.punitions
});
let hash = 0;
for (let i = 0; i < dataStr.length; i++) {
const char = dataStr.charCodeAt(i);
hash = ((hash << 5) - hash) + char;
hash = hash & hash;
}
return hash.toString();
}

function getCacheKey(question, eleveData) {
const hash = getDataHash(eleveData);
if (!hash) return null;
const normalizedQuestion = question.toLowerCase().trim().replace(/\s+/g, ' ');
return `${hash}_${normalizedQuestion}`;
}

async function chercherInfosFinancieresParCode(code) {
try {
const eleves = [];
const moisListe = ["Septembre", "Octobre", "Novembre", "Decembre", "Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin"];
const moisActuel = getMoisActuel();
const collections = ['compta_eleves', 'prima_eleves', 'mater_eleves'];
for (const coll of collections) {
const q = query(collection(db, "ecoles", ECOLET_ID, coll), where("parentCode", "==", code));
const snap = await getDocs(q);
snap.forEach(doc => {
const data = doc.data();
if (data.nom) {
let espace = 'secondaire';
if (coll === 'prima_eleves') espace = 'primaire';
else if (coll === 'mater_eleves') espace = 'maternelle';
eleves.push({ id: doc.id, espace: espace, ...data });
}
});
}
if (eleves.length === 0) return null;
const resultats = [];
for (const e of eleves) {
const paiements = e.paiements || {};
const minerval = e.minerval || 25000;
const moisBlancs = e.moisBlancs || [];
let totalPaye = 0;
for (let i = 0; i < moisListe.length; i++) {
const mois = moisListe[i];
totalPaye += paiements[mois]?.montant || 0;
}
const nbMoisPayants = 10 - moisBlancs.length;
const totalMinervalEffectif = minerval * nbMoisPayants;
const reste = totalMinervalEffectif - totalPaye;
let moisImpayes = [];
const dateInscription = e.dateInscription || new Date().toISOString();
const moisInscription = getMoisFromDate(dateInscription);
const indexInscription = moisListe.indexOf(moisInscription);
const indexActuel = moisListe.indexOf(moisActuel);
for (let i = indexInscription; i < indexActuel; i++) {
const mois = moisListe[i];
if (!estMoisDansAnnee(mois)) continue;
if (moisBlancs.includes(mois)) continue;
const montant = paiements[mois]?.montant || 0;
if (montant < minerval && !e.exonere) moisImpayes.push(mois);
}
let statut = "En ordre";
if (e.exonere) statut = "Exonéré";
else if (moisImpayes.length >= 3) statut = "Liste noire";
else if (moisImpayes.length > 0) statut = "Paiement partiel";
resultats.push({
id: e.id,
nom: e.nom,
prenom: e.prenom || "",
sexe: e.sexe || "M",
classe: e.classe,
option: e.option || "",
exonere: e.exonere || false,
minerval: minerval,
totalPaye: totalPaye,
reste: reste,
moisImpayes: moisImpayes,
statut: statut,
parentCode: e.parentCode,
dateInscription: dateInscription,
moisBlancs: moisBlancs,
espace: e.espace,
paiements: paiements
});
}
return resultats;
} catch (e) { return null; }
}

function convertirNombreEnFrancais(n) {
if (n === 0) return 'zéro';
if (n < 0) return 'moins ' + convertirNombreEnFrancais(-n);
const unite = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
const dizaine = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante-dix', 'quatre-vingt', 'quatre-vingt-dix'];
if (n < 20) return unite[n];
if (n < 100) {
const d = Math.floor(n / 10);
const u = n % 10;
if (d === 7 || d === 9) {
const base = (d === 7) ? 'soixante' : 'quatre-vingt';
const reste = (d === 7) ? n - 60 : n - 80;
return base + '-' + convertirNombreEnFrancais(reste);
}
if (u === 0) {
if (d === 8) return 'quatre-vingts';
return dizaine[d];
}
if (d === 8) return 'quatre-vingt-' + unite[u];
return dizaine[d] + '-' + unite[u];
}
if (n < 1000) {
const c = Math.floor(n / 100);
const r = n % 100;
if (c === 1) {
if (r === 0) return 'cent';
return 'cent ' + convertirNombreEnFrancais(r);
}
if (r === 0) return unite[c] + ' cents';
return unite[c] + ' cent ' + convertirNombreEnFrancais(r);
}
if (n < 1000000) {
const m = Math.floor(n / 1000);
const r = n % 1000;
if (m === 1) {
if (r === 0) return 'mille';
return 'mille ' + convertirNombreEnFrancais(r);
}
if (r === 0) return convertirNombreEnFrancais(m) + ' mille';
return convertirNombreEnFrancais(m) + ' mille ' + convertirNombreEnFrancais(r);
}
if (n < 1000000000) {
const m = Math.floor(n / 1000000);
const r = n % 1000000;
if (m === 1) {
if (r === 0) return 'un million';
return 'un million ' + convertirNombreEnFrancais(r);
}
if (r === 0) return convertirNombreEnFrancais(m) + ' millions';
return convertirNombreEnFrancais(m) + ' millions ' + convertirNombreEnFrancais(r);
}
return n.toString();
}

function genererPropositions(eleveData) {
const sections = {
frais: { emoji: '', nom: 'les frais' },
notes: { emoji: '', nom: 'les notes' },
punitions: { emoji: '', nom: 'les punitions' }
};
const nonVisitees = Object.keys(sections).filter(section => !sectionDejaVisitee(section));
if (nonVisitees.length === 0) {
return `\n\nVous avez vu toutes les informations sur ${eleveData.nom} ${eleveData.prenom||''}.`;
}
let propositions = '\n\nVoulez-vous voir ';
const noms = nonVisitees.map(s => sections[s].nom);
if (noms.length === 1) propositions += noms[0] + ' maintenant ?';
else if (noms.length === 2) propositions += noms[0] + ' ou ' + noms[1] + ' ?';
else propositions += noms.slice(0, -1).join(', ') + ' ou ' + noms[noms.length - 1] + ' ?';
return propositions;
}

async function genererReponseNotes(eleveData) {
ajouterSectionVisitee('notes');

const notesValides = notes.filter(n => n.note > 0);

if (notesValides.length === 0) {
return `${nomComplet} n'a pas encore de notes enregistrées.`;
}

let meilleureNote = null;
let meilleurPourcentage = 0;

notesValides.forEach(n => {
const pourcentage = (n.note / n.max) * 100;
if (pourcentage > meilleurPourcentage) {
meilleurPourcentage = pourcentage;
meilleureNote = n;
}
});

const periodeEnLettres = { 1: 'première', 2: 'deuxième', 3: 'troisième', 4: 'quatrième' };
const periodeTexte = meilleureNote.periode ? periodeEnLettres[meilleureNote.periode] || `période ${meilleureNote.periode}` : '';

let reponse = `La meilleure note de ${nomComplet} est ${meilleureNote.note} sur ${meilleureNote.max}`;
if (meilleureNote.matiere) reponse += ` en ${meilleureNote.matiere}`;
if (meilleureNote.epreuve) {
const typeEpreuve = meilleureNote.epreuve.toLowerCase();

async function genererReponseFrais(eleveData) {
ajouterSectionVisitee('frais');
const nomComplet = `${eleveData.nom} ${eleveData.prenom || ''}`.trim();
const minerval = eleveData.frais.minerval;
const paiements = eleveData.frais.paiements || {};
const moisBlancs = eleveData.frais.moisBlancs || [];

const moisListe = ["Septembre", "Octobre", "Novembre", "Decembre", "Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin"];
const moisActuel = getMoisActuel();
const indexActuel = moisListe.indexOf(moisActuel);
const annee = new Date().getFullYear();

let totalPaye = 0;
let moisPayes = [];
let moisImpayes = [];

for (let i = 0; i < indexActuel; i++) {
const mois = moisListe[i];
const paiement = paiements[mois];
const montant = paiement?.montant || 0;
const datePaiement = paiement?.date || null;

if (moisBlancs.includes(mois)) {
continue;
}

if (montant >= minerval) {
totalPaye += minerval;
moisPayes.push({ mois, montant: minerval, date: datePaiement });
} else if (montant > 0 && montant < minerval) {
totalPaye += montant;
const resteMois = minerval - montant;
moisImpayes.push({ mois, reste: resteMois, date: datePaiement });
} else {
moisImpayes.push({ mois, reste: minerval, date: null });
}
}

let resteTotal = 0;
for (const m of moisImpayes) {
resteTotal += m.reste;
}

let reponseEcran = `Situation financière de ${nomComplet}\n\n`;

if (moisPayes.length > 0) {
reponseEcran += `Mois payés :\n\n`;
for (const mp of moisPayes) {
const dateFormatee = mp.date ? new Date(mp.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'date inconnue';
reponseEcran += `${mp.mois} ${annee}\n`;
reponseEcran += `${mp.montant.toLocaleString()} FC\n`;
reponseEcran += `Payé le ${dateFormatee}\n\n`;
}
}

if (moisImpayes.length > 0) {
reponseEcran += `Mois impayé${moisImpayes.length > 1 ? 's' : ''} :\n\n`;
for (const mi of moisImpayes) {
reponseEcran += `${mi.mois} ${annee}\n`;
reponseEcran += `${mi.reste.toLocaleString()} FC\n`;
reponseEcran += `Reste à payer\n\n`;
}
}

if (moisPayes.length === 0 && moisImpayes.length === 0) {
reponseEcran += `Aucun mois payé\n\nAucun mois impayé\n\n`;
}

reponseEcran += `Total payé : ${totalPaye.toLocaleString()} FC\n\n`;
reponseEcran += `Reste à payer : ${resteTotal.toLocaleString()} FC`;

const notesDejaVues = sectionDejaVisitee('notes');
const punitionsDejaVues = sectionDejaVisitee('punitions');

const aDesNotes = eleveData.notes && eleveData.notes.filter(n => n.note > 0).length > 0;
const aDesPunitions = eleveData.punitions && eleveData.punitions.length > 0;

const section = eleveData.section;
if (section === "SECONDAIRE") {
let propositions = [];

if (aDesNotes && !notesDejaVues) {
propositions.push("ses notes de cours");
}
if (aDesPunitions && !punitionsDejaVues) {
propositions.push("ses punitions");
}

if (propositions.length === 2) {
reponseEcran += `\n\nVoulez-vous consulter ${propositions[0]} ou ${propositions[1]} ?`;
derniereQuestion = "finance_notes_punitions";
} else if (propositions.length === 1) {
reponseEcran += `\n\nVoulez-vous consulter ${propositions[0]} ?`;
derniereQuestion = "finance_" + (propositions[0].includes("notes") ? "notes" : "punitions");
} else {
reponseEcran += `\n\nVous avez déjà vu toutes les informations disponibles pour ${nomComplet}. Veuillez taper un autre code parent. Je suis là pour vous aider.`;
derniereQuestion = "fin";
}
}

if (listeElevesComplets.length > 1) {
const currentIndex = listeElevesComplets.findIndex(e => e.nom === eleveData.nom && (e.prenom || '') === (eleveData.prenom || ''));
const estDernier = (currentIndex === listeElevesComplets.length - 1);
if (!estDernier) {
reponseEcran += `\n\nTapez "suivant" pour passer au prochain élève.`;
}
}

return reponseEcran;
}

reponse = reponse.replace(/pour cent/g, 'points');
reponse = reponse.replace(/pourcentage/g, 'points');

reponse = reponse.replace(/moyenne/g, '');
reponse = reponse.replace(/proclamation/g, '');

}

const reponseConfusion = gererConfusion(message, dernierEleveData);

reponse += `${index+1}. ${eleve.nom} ${eleve.prenom||''} - ${eleve.classe}${optionText}${estActif}\n`;
});
reponse += `\nPour changer d'enfant, tapez "suivant".`;

} else if (listeElevesComplets.length === 1) {

}

if (enAttenteChoixEleve && listeElevesEnAttente.length > 0) {

listeElevesEnAttente = [];

} else {
let listeNoms = listeElevesEnAttente.map((e, i) => {
const section = getSectionFromClasse(e.classe);

return `${i+1}. ${e.nom} ${e.prenom} - ${e.classe}${optionText}`;
}).join('\n');
return `Choix non reconnu. Veuillez choisir un numéro entre 1 et ${listeElevesEnAttente.length} :\n\n${listeNoms}`;
}
}

async function typeWriterEffect(element, text, speed = 15) {

}
