<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Registration · NeTubeX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#0a1628 0%,#0f2942 40%,#0d1f35 70%,#0a1628 100%);font-family:'Inter',sans-serif;padding:20px}
.register-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:32px;padding:40px 36px;max-width:400px;width:100%;border:1px solid rgba(255,255,255,0.08);box-shadow:0 40px 100px rgba(0,0,0,0.4)}
.register-card .logo{text-align:center;margin-bottom:20px}
.register-card .logo .icon{font-size:48px;background:linear-gradient(135deg,#6C63FF,#4A42D4);width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto;color:#fff;font-weight:900;font-size:28px}
.register-card h1{color:#fff;font-size:22px;font-weight:800;text-align:center;margin-bottom:2px}
.register-card .sub{color:rgba(255,255,255,0.4);font-size:13px;text-align:center;margin-bottom:20px}
.register-card .sub strong{color:#6C63FF}
.sources-info{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.sources-info .badge{padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600}
.sources-info .badge.a{background:rgba(59,130,246,0.15);color:#3b82f6;border:1px solid rgba(59,130,246,0.2)}
.sources-info .badge.b{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.2)}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:rgba(255,255,255,0.4);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.form-group input{width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.06);color:#fff;font-size:15px;outline:none;transition:all 0.3s ease;font-family:'Inter',sans-serif}
.form-group input:focus{border-color:#6C63FF;background:rgba(255,255,255,0.08);box-shadow:0 0 0 4px rgba(108,99,255,0.06)}
.form-group input::placeholder{color:rgba(255,255,255,0.2)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6C63FF,#4A42D4);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 30px rgba(108,99,255,0.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(108,99,255,0.35)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn .spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#f87171;font-size:13px;text-align:center;min-height:20px;margin-top:8px}
.success{color:#34d399;font-size:13px;text-align:center;min-height:20px;margin-top:8px}
.info{color:rgba(255,255,255,0.3);font-size:11px;text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.04)}
.info a{color:#6C63FF;text-decoration:none}
.status-box{background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 16px;margin:12px 0;border:1px solid rgba(255,255,255,0.06)}
.status-box .status-item{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:rgba(255,255,255,0.5)}
.status-box .status-item .check{font-weight:700}
.status-box .status-item .check.success{color:#34d399}
.status-box .status-item .check.fail{color:#f87171}
.status-box .status-item .check.waiting{color:rgba(255,255,255,0.2)}
</style>
</head>
<body>

<div class="register-card">
<div class="logo"><div class="icon">N</div></div>
<h1>📝 Admin Registration</h1>
<p class="sub">Compte unique pour <strong>SOURCE A</strong> et <strong>SOURCE B</strong></p>

<div class="sources-info">
<span class="badge a">🔵 SOURCE A</span>
<span class="badge b">🟢 SOURCE B</span>
</div>

<div class="form-group">
<label>👤 Nom</label>
<input type="text" id="regName" placeholder="Votre nom complet">
</div>

<div class="form-group">
<label>📧 Email</label>
<input type="email" id="regEmail" placeholder="admin@netubex.com">
</div>

<div class="form-group">
<label>🔑 Mot de passe</label>
<input type="password" id="regPassword" placeholder="Minimum 6 caractères">
</div>

<div class="form-group">
<label>🔐 Confirmer</label>
<input type="password" id="regPasswordConfirm" placeholder="Retapez le mot de passe">
</div>

<div class="status-box" id="statusBox" style="display:none;">
<div class="status-item"><span>🔵 SOURCE A</span><span class="check waiting" id="statusA">⏳ En attente</span></div>
<div class="status-item"><span>🟢 SOURCE B</span><span class="check waiting" id="statusB">⏳ En attente</span></div>
</div>

<button class="btn" id="registerBtn">
<span class="spinner"></span>
<span class="btn-text">📝 CRÉER LE COMPTE</span>
</button>

<div id="registerError" class="error"></div>
<div id="registerSuccess" class="success"></div>

<div class="info">
🔗 Déjà un compte ? <a href="login_admin.html">Connectez-vous</a>
</div>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"}}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, createUserWithEmailAndPassword } from "firebase/auth";

const firebaseConfigA = {
apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
authDomain: "gesco-67c43.firebaseapp.com",
projectId: "gesco-67c43",
storageBucket: "gesco-67c43.firebasestorage.app",
messagingSenderId: "333004443566",
appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const firebaseConfigB = {
apiKey: "AIzaSyBma80S0bc9uzSuO38qn7JLSwLrYniV5Fw",
authDomain: "gesco-2.firebaseapp.com",
projectId: "gesco-2",
storageBucket: "gesco-2.firebasestorage.app",
messagingSenderId: "36319988765",
appId: "1:36319988765:web:e8cd823804596495248af4"
};

const appA = initializeApp(firebaseConfigA, 'sourceA');
const appB = initializeApp(firebaseConfigB, 'sourceB');

const authA = getAuth(appA);
const authB = getAuth(appB);

const registerBtn = document.getElementById('registerBtn');
const regName = document.getElementById('regName');
const regEmail = document.getElementById('regEmail');
const regPassword = document.getElementById('regPassword');
const regPasswordConfirm = document.getElementById('regPasswordConfirm');
const registerError = document.getElementById('registerError');
const registerSuccess = document.getElementById('registerSuccess');
const statusBox = document.getElementById('statusBox');
const statusA = document.getElementById('statusA');
const statusB = document.getElementById('statusB');

async function registerAdmin(email, password) {
    let createdA = false;
    let createdB = false;

    statusBox.style.display = 'block';
    statusA.textContent = '⏳ Création...';
    statusA.className = 'check waiting';
    statusB.textContent = '⏳ Création...';
    statusB.className = 'check waiting';

    try {
        await createUserWithEmailAndPassword(authA, email, password);
        createdA = true;
        statusA.textContent = '✅ Créé';
        statusA.className = 'check success';
    } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
            createdA = true;
            statusA.textContent = '✅ Déjà existant';
            statusA.className = 'check success';
        } else {
            statusA.textContent = '❌ ' + e.message;
            statusA.className = 'check fail';
        }
    }

    try {
        await createUserWithEmailAndPassword(authB, email, password);
        createdB = true;
        statusB.textContent = '✅ Créé';
        statusB.className = 'check success';
    } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
            createdB = true;
            statusB.textContent = '✅ Déjà existant';
            statusB.className = 'check success';
        } else {
            statusB.textContent = '❌ ' + e.message;
            statusB.className = 'check fail';
        }
    }

    if (createdA && createdB) {
        return { success: true, message: '✅ Compte Admin créé dans les DEUX projets' };
    } else if (createdA) {
        return { success: true, message: '⚠️ Compte créé UNIQUEMENT dans SOURCE A' };
    } else if (createdB) {
        return { success: true, message: '⚠️ Compte créé UNIQUEMENT dans SOURCE B' };
    } else {
        return { success: false, message: '❌ Échec dans les DEUX projets' };
    }
}

async function handleRegister() {
    const name = regName.value.trim();
    const email = regEmail.value.trim();
    const password = regPassword.value.trim();
    const confirm = regPasswordConfirm.value.trim();

    registerError.textContent = '';
    registerSuccess.textContent = '';
    statusBox.style.display = 'none';

    if (!name) {
        registerError.textContent = '❌ Veuillez saisir votre nom';
        return;
    }

    if (!email) {
        registerError.textContent = '❌ Veuillez saisir un email';
        return;
    }

    if (!password || password.length < 6) {
        registerError.textContent = '❌ Le mot de passe doit contenir au moins 6 caractères';
        return;
    }

    if (password !== confirm) {
        registerError.textContent = '❌ Les mots de passe ne correspondent pas';
        return;
    }

    registerBtn.disabled = true;
    registerBtn.classList.add('loading');

    try {
        const result = await registerAdmin(email, password);

        if (result.success) {
            registerSuccess.textContent = result.message;
            registerError.textContent = '';

            if (result.message.includes('DEUX projets')) {
                setTimeout(() => {
                    window.location.href = 'login_admin.html?registered=true';
                }, 3000);
            }
        } else {
            registerError.textContent = result.message;
            registerSuccess.textContent = '';
        }
    } catch (error) {
        registerError.textContent = '❌ Erreur: ' + error.message;
    } finally {
        registerBtn.disabled = false;
        registerBtn.classList.remove('loading');
    }
}

registerBtn.addEventListener('click', handleRegister);

regPasswordConfirm.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleRegister();
});

regPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') regPasswordConfirm.focus();
});

regEmail.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') regPassword.focus();
});

regName.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') regEmail.focus();
});

console.log('🔐 Admin Registration prêt');
console.log('📁 SOURCE A:', firebaseConfigA.projectId);
console.log('📁 SOURCE B:', firebaseConfigB.projectId);
</script>
</body>
</html>
