<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8edf4">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:#e8edf4;color:#0f172a}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2}
.bg-fixed-inner{width:100%;height:100%;background:linear-gradient(160deg,#e8edf4 0%,#dce3ec 50%,#d0d8e4 100%)}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(ellipse at 30% 20%,rgba(37,99,235,0.08),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(56,189,248,0.05),transparent 50%)}
.header-fixed{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,0.65);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.04);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.header{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.search-wrap{position:relative;flex:1;max-width:600px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:#94a3b8;opacity:0.7}
.search-input{width:100%;padding:8px 14px 8px 40px;border-radius:40px;border:1px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13px;font-family:inherit;color:#0f172a;transition:all 0.3s;outline:none;box-shadow:0 2px 12px rgba(0,0,0,0.02)}
.search-input:focus{border-color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);box-shadow:0 4px 20px rgba(0,0,0,0.04)}
.search-input::placeholder{color:#94a3b8;font-weight:400}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.03);border:none;font-size:11px;color:#94a3b8;cursor:pointer;padding:2px 8px;display:none;border-radius:30px}
.search-clear:hover{color:#0f172a;background:rgba(0,0,0,0.06)}
.btn-home{background:rgba(255,255,255,0.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.5);padding:6px 16px;border-radius:40px;font-size:12px;font-weight:500;color:#475569;cursor:pointer;transition:all 0.3s;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.btn-home:hover{background:rgba(255,255,255,0.7);color:#0f172a;box-shadow:0 4px 16px rgba(0,0,0,0.04)}
.main-container{position:fixed;top:64px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:24px 16px 30px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.main-container::-webkit-scrollbar{width:3px}
.main-container::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
.schools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:40px 28px;max-width:1200px;margin:0 auto;padding-top:4px}
.school-card{position:relative;background:rgba(255,255,255,0.7);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-radius:32px;padding:0 20px 20px;cursor:pointer;transition:all 0.5s cubic-bezier(0.2,0.9,0.4,1);box-shadow:0 8px 32px rgba(0,0,0,0.04),0 2px 8px rgba(0,0,0,0.02),inset 0 1px 0 rgba(255,255,255,0.6);opacity:0;animation:cardFadeIn 0.6s cubic-bezier(0.2,0.9,0.4,1) forwards;transform-style:preserve-3d;perspective:800px;border:1px solid rgba(255,255,255,0.3)}
.school-card:nth-child(1){animation-delay:0.02s}
.school-card:nth-child(2){animation-delay:0.04s}
.school-card:nth-child(3){animation-delay:0.06s}
.school-card:nth-child(4){animation-delay:0.08s}
.school-card:nth-child(5){animation-delay:0.10s}
.school-card:nth-child(6){animation-delay:0.12s}
.school-card:nth-child(7){animation-delay:0.14s}
.school-card:nth-child(8){animation-delay:0.16s}
.school-card:nth-child(9){animation-delay:0.18s}
.school-card:nth-child(10){animation-delay:0.20s}
@keyframes cardFadeIn{0%{opacity:0;transform:translateY(24px) rotateX(2deg) scale(0.98)}100%{opacity:1;transform:translateY(0) rotateX(0deg) scale(1)}}
.school-card::before{content:'';position:absolute;inset:0;border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,0.5),rgba(255,255,255,0));pointer-events:none;z-index:1}
.school-card::after{content:'';position:absolute;bottom:-10px;left:10%;right:10%;height:30px;background:radial-gradient(ellipse,rgba(0,0,0,0.06),transparent 70%);filter:blur(16px);border-radius:50%;pointer-events:none;transition:all 0.5s ease;z-index:0}
.school-card:hover{transform:translateY(-8px) rotateX(2deg) rotateY(-1deg) scale(1.01);box-shadow:0 24px 64px rgba(0,0,0,0.08),0 8px 24px rgba(0,0,0,0.04),inset 0 1px 0 rgba(255,255,255,0.8);border-color:rgba(255,255,255,0.5)}
.school-card:hover::after{bottom:-14px;left:5%;right:5%;background:radial-gradient(ellipse,rgba(0,0,0,0.09),transparent 70%)}
.school-card:active{transform:scale(0.97) rotateX(0deg);transition-duration:0.1s}
.school-card.hidden{display:none}
.school-card .card-gradient{position:absolute;top:0;left:0;right:0;height:160px;border-radius:32px 32px 0 0;z-index:0;opacity:0.5}
.school-logo-area{position:relative;width:200px;height:200px;margin:0 auto;margin-top:20px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px solid rgba(255,255,255,0.6);box-shadow:0 8px 40px rgba(0,0,0,0.06),0 2px 8px rgba(0,0,0,0.02),inset 0 1px 0 rgba(255,255,255,0.8);transition:all 0.5s ease;transform:translateY(0);z-index:2}
.school-card:hover .school-logo-area{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 48px rgba(0,0,0,0.08),0 4px 12px rgba(0,0,0,0.03),inset 0 1px 0 rgba(255,255,255,0.9)}
.school-logo-area .school-logo-img{width:100%;height:100%;object-fit:cover}
.school-logo-area .logo-placeholder{font-size:56px;color:#cbd5e1;font-weight:300}
.school-info{position:relative;z-index:2;text-align:center;padding-top:16px}
.school-name{font-size:17px;font-weight:700;color:#0f172a;letter-spacing:-0.2px;line-height:1.3}
.school-name .prefix{font-weight:400;color:#94a3b8;font-size:13px;display:block;margin-bottom:2px}
.school-location{font-size:13px;color:#64748b;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.school-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:14px;border-top:1px solid rgba(0,0,0,0.04)}
.school-rating{font-size:12px;display:flex;align-items:center;gap:4px}
.school-rating .stars{color:#f59e0b;letter-spacing:0.5px}
.school-rating .value{color:#94a3b8;font-weight:500}
.school-code{font-size:10px;color:#94a3b8;font-family:monospace;background:rgba(241,245,249,0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:2px 12px;border-radius:30px;letter-spacing:0.3px;border:1px solid rgba(255,255,255,0.3)}
.btn-access{background:rgba(15,23,42,0.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);padding:6px 20px;border-radius:40px;font-size:12px;font-weight:600;color:#ffffff;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:4px;flex-shrink:0}
.btn-access:after{content:"→";transition:transform 0.3s}
.school-card:hover .btn-access{background:#0f172a;border-color:rgba(255,255,255,0.2)}
.school-card:hover .btn-access:after{transform:translateX(4px)}
.no-result{text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px;grid-column:1/-1;background:rgba(255,255,255,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:32px;border:1px solid rgba(255,255,255,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.04)}
@media(max-width:768px){.schools-grid{grid-template-columns:1fr 1fr;gap:32px 20px}
.school-logo-area{width:160px;height:160px;margin-top:16px}
.school-name{font-size:15px}
.main-container{padding:20px 14px 30px;top:60px}
.header{padding:8px 12px}}
@media(max-width:480px){.schools-grid{grid-template-columns:1fr;gap:28px}
.school-logo-area{width:180px;height:180px;margin-top:14px}
.school-logo-area .logo-placeholder{font-size:44px}
.school-card{padding:0 16px 16px;border-radius:28px}
.school-card .card-gradient{height:140px;border-radius:28px 28px 0 0}
.school-name{font-size:15px}
.school-name .prefix{font-size:12px}
.school-bottom{flex-wrap:wrap;justify-content:center;gap:8px}
.btn-access{width:100%;justify-content:center}
.main-container{padding:14px 10px 30px;top:58px}
.search-input{padding:7px 12px 7px 36px;font-size:12px}
.search-icon{font-size:12px;left:12px}
.btn-home{padding:5px 12px;font-size:11px}
.header{padding:6px 10px}}
</style>
</head>
<body>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="header-fixed">
<div class="header">
<div class="search-wrap"><span class="search-icon">⌕</span><input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Effacer">✕</button></div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">🏠 Accueil</a>
</div>
</div>
<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList"></div>
</div>

<script>
// === PROTECTION ANTI-INSPECTION ===
document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false}return true});
document.addEventListener('selectstart',function(e){e.preventDefault();return false});
document.addEventListener('copy',function(e){e.preventDefault();return false});
document.addEventListener('cut',function(e){e.preventDefault();return false});
document.addEventListener('paste',function(e){e.preventDefault();return false});

// === DONNÉES DES ÉCOLES EN DUR ===
// Plus besoin de Firebase ! Les données sont directement intégrées.
const SCHOOLS = [
  {
    id: "tremplin",
    name: "Tremplin",
    city: "Kasumbalesa",
    logo: "tremplin.png"
  },
  {
    id: "amour",
    name: "Amour",
    city: "Lubumbashi",
    logo: "amour.png"
  },
  {
    id: "gloriadei",
    name: "Gloria Dei",
    city: "Kasumbalesa",
    logo: "gloriadei.png"
  },
  {
    id: "excellence",
    name: "Excellence",
    city: "Lubumbashi",
    logo: "excellence.png"
  },
  {
    id: "lumière",
    name: "Lumière",
    city: "Lubumbashi",
    logo: "lumière.png"
  },
  {
    id: "source",
    name: "Source",
    city: "Lubumbashi",
    logo: "source.png"
  },
  {
    id: "perseverance",
    name: "Persévérance",
    city: "Lubumbashi",
    logo: "perseverance.png"
  }
];

// Placeholders et couleurs pour les cartes
const PLACEHOLDERS = ['⌘','✦','◈','◆','▣','◉','◎'];
const GRADIENTS = [
  '#2563eb,#1e40af',
  '#7c3aed,#5b21b6',
  '#0891b2,#0e7490',
  '#059669,#047857',
  '#d97706,#b45309',
  '#dc2626,#b91c1c',
  '#4f46e5,#4338ca'
];

let allCards = [];

// === GESTION PWA ===
const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
if (isPWA) {
  const savedSchool = localStorage.getItem('pwa_school_id');
  if (savedSchool && !window.location.search.includes('ecole')) {
    const targetUrl = new URL('/', window.location.origin);
    targetUrl.searchParams.set('ecole', savedSchool);
    targetUrl.searchParams.set('from', 'pwa');
    targetUrl.searchParams.set('t', Date.now());
    window.location.href = targetUrl.toString();
    throw new Error('Redirection PWA');
  }
}

// === GÉNÉRATION DES CARTES ===
function generateCard(school, index) {
  const safeName = school.name.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m));
  const safeCity = school.city.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m));
  
  // Étoiles aléatoires (pour garder l'ambiance)
  const rating = (3.5 + Math.random() * 1.5).toFixed(1);
  const stars = '★'.repeat(Math.round(parseFloat(rating)));
  
  const phIndex = index % PLACEHOLDERS.length;
  const gradIndex = index % GRADIENTS.length;
  const grad = GRADIENTS[gradIndex];
  
  // Construction du logo : si l'URL est fournie, on l'utilise
  const logoHtml = school.logo 
    ? `<img class="school-logo-img" src="${school.logo}" alt="${safeName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : `<div class="logo-placeholder">${PLACEHOLDERS[phIndex]}</div>`;
  
  return {
    html: `<div class="school-card" data-prefixe="${school.id}" data-nom="${school.name.toLowerCase()}" data-ville="${school.city.toLowerCase()}">
      <div class="card-gradient" style="background:linear-gradient(145deg,${grad});"></div>
      <div class="school-logo-area">
        ${logoHtml}
      </div>
      <div class="school-info">
        <div class="school-name"><span class="prefix">COMPLEXE SCOLAIRE</span> ${safeName}</div>
        <div class="school-location">📍 ${safeCity}</div>
        <div class="school-bottom">
          <div class="school-rating"><span class="stars">${stars}</span><span class="value">${rating}</span></div>
          <span class="school-code">${school.id}</span>
          <div class="btn-access">Accéder</div>
        </div>
      </div>
    </div>`,
    id: school.id,
    name: school.name.toLowerCase(),
    city: school.city.toLowerCase()
  };
}

// === CHARGEMENT DES ÉCOLES ===
function loadSchools() {
  const container = document.getElementById('schoolsList');
  
  if (SCHOOLS.length === 0) {
    container.innerHTML = '<div class="no-result">Aucune école disponible</div>';
    return;
  }
  
  // Tri : les écoles commençant par 't' en premier (comme avant)
  const tSchools = SCHOOLS.filter(s => s.name.toLowerCase().startsWith('t'));
  const otherSchools = SCHOOLS.filter(s => !s.name.toLowerCase().startsWith('t'));
  const sortedSchools = [...tSchools, ...otherSchools];
  
  // Générer les cartes
  allCards = sortedSchools.map((school, index) => generateCard(school, index));
  renderCards(allCards);
  setupClicks();
}

function renderCards(cards) {
  const container = document.getElementById('schoolsList');
  if (cards.length === 0) {
    container.innerHTML = '<div class="no-result">Aucun établissement trouvé</div>';
    return;
  }
  container.innerHTML = cards.map(c => c.html).join('');
}

// === RECHERCHE ===
function setupSearch() {
  const input = document.getElementById('searchInput');
  const clear = document.getElementById('searchClear');
  
  input.addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    clear.style.display = q.length > 0 ? 'block' : 'none';
    
    const filtered = allCards.filter(c => 
      c.name.includes(q) || c.city.includes(q)
    );
    renderCards(filtered);
    setupClicks();
  });
  
  clear.addEventListener('click', function() {
    document.getElementById('searchInput').value = '';
    this.style.display = 'none';
    renderCards(allCards);
    setupClicks();
    document.getElementById('searchInput').focus();
  });
}

// === CLIC SUR UNE CARTE ===
function setupClicks() {
  document.querySelectorAll('.school-card').forEach(card => {
    card.addEventListener('click', function(e) {
      e.stopPropagation();
      const prefixe = this.getAttribute('data-prefixe');
      if (prefixe && prefixe !== 'null' && prefixe !== 'undefined') {
        localStorage.setItem('pwa_school_id', prefixe);
        localStorage.setItem('lastSchoolId', prefixe);
        
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        let targetUrl;
        if (isPWA) {
          const baseUrl = new URL('/', window.location.origin);
          baseUrl.searchParams.set('ecole', prefixe);
          baseUrl.searchParams.set('from', 'pwa');
          baseUrl.searchParams.set('t', Date.now());
          targetUrl = baseUrl.toString();
        } else {
          targetUrl = '/schooling?ecole=' + encodeURIComponent(prefixe);
        }
        window.location.href = targetUrl;
      }
    });
  });
}

// === INITIALISATION ===
loadSchools();
setupSearch();
</script>
</body>
</html>
