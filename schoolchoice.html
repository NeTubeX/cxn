<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f0f4ff">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="bingbot" content="noindex, nofollow">
<meta name="slurp" content="noindex, nofollow">
<meta name="revisit-after" content="never">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:#f0f4ff;color:#0a0a1a}
canvas#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2}
.bg-fixed-inner{width:100%;height:100%;background:linear-gradient(145deg,#f0f4ff 0%,#e8edf8 40%,#dce3f0 100%)}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(ellipse at 20% 10%,rgba(99,102,241,0.12),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(139,92,246,0.08),transparent 50%)}
.header-fixed{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,0.5);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border-bottom:1.5px solid rgba(255,255,255,0.4);box-shadow:0 4px 40px rgba(0,0,0,0.04);padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.header{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.search-wrap{position:relative;flex:1;max-width:600px}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;color:#6b7280;opacity:0.6}
.search-input{width:100%;padding:10px 16px 10px 44px;border-radius:50px;border:1.5px solid rgba(255,255,255,0.6);background:rgba(255,255,255,0.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:15px;font-family:inherit;color:#0a0a1a;transition:all 0.3s;outline:none;box-shadow:0 2px 16px rgba(0,0,0,0.02)}
.search-input:focus{border-color:rgba(99,102,241,0.4);background:rgba(255,255,255,0.8);box-shadow:0 4px 24px rgba(99,102,241,0.08)}
.search-input::placeholder{color:#9ca3af;font-weight:400}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.04);border:none;font-size:11px;color:#9ca3af;cursor:pointer;padding:3px 10px;display:none;border-radius:30px;transition:all 0.2s}
.search-clear:hover{color:#0a0a1a;background:rgba(0,0,0,0.08)}
.btn-home{background:rgba(255,255,255,0.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,0.6);padding:8px 20px;border-radius:50px;font-size:13px;font-weight:600;color:#4b5563;cursor:pointer;transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1);text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,0.02)}
.btn-home:hover{background:rgba(255,255,255,0.85);color:#0a0a1a;box-shadow:0 4px 20px rgba(99,102,241,0.12);transform:translateY(-2px) scale(1.02)}
.btn-home:active{transform:scale(0.95)}
.main-container{position:fixed;top:70px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:28px 20px 40px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.main-container::-webkit-scrollbar{width:4px}
.main-container::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.2);border-radius:20px}
.main-container::-webkit-scrollbar-track{background:transparent}
.schools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px 24px;max-width:1200px;margin:0 auto;padding-top:4px}
.school-card{position:relative;background:rgba(255,255,255,0.6);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border-radius:40px;padding:0 24px 24px;cursor:pointer;transition:all 0.5s cubic-bezier(0.2,0.9,0.4,1);box-shadow:0 8px 40px rgba(0,0,0,0.04),0 2px 12px rgba(0,0,0,0.02),inset 0 1px 0 rgba(255,255,255,0.8);opacity:0;animation:cardFadeIn 0.7s cubic-bezier(0.2,0.9,0.4,1) forwards;transform-style:preserve-3d;perspective:1000px;border:1.5px solid rgba(255,255,255,0.5)}
.school-card:nth-child(1){animation-delay:0.03s}
.school-card:nth-child(2){animation-delay:0.06s}
.school-card:nth-child(3){animation-delay:0.09s}
.school-card:nth-child(4){animation-delay:0.12s}
.school-card:nth-child(5){animation-delay:0.15s}
@keyframes cardFadeIn{0%{opacity:0;transform:translateY(30px) rotateX(3deg) scale(0.96)}100%{opacity:1;transform:translateY(0) rotateX(0deg) scale(1)}}
.school-card::before{content:'';position:absolute;inset:0;border-radius:40px;background:linear-gradient(145deg,rgba(255,255,255,0.5),rgba(255,255,255,0));pointer-events:none;z-index:1}
.school-card::after{content:'';position:absolute;bottom:-12px;left:10%;right:10%;height:40px;background:radial-gradient(ellipse,rgba(0,0,0,0.05),transparent 70%);filter:blur(20px);border-radius:50%;pointer-events:none;transition:all 0.5s ease;z-index:0}
.school-card:hover{transform:translateY(-10px) rotateX(2deg) rotateY(-2deg) scale(1.02);box-shadow:0 28px 72px rgba(99,102,241,0.12),0 8px 28px rgba(0,0,0,0.04),inset 0 1px 0 rgba(255,255,255,0.9);border-color:rgba(255,255,255,0.7)}
.school-card:hover::after{bottom:-16px;left:5%;right:5%;background:radial-gradient(ellipse,rgba(99,102,241,0.08),transparent 70%)}
.school-card:active{transform:scale(0.97) rotateX(0deg);transition-duration:0.1s}
.school-card.hidden{display:none}
.school-card .card-gradient{position:absolute;top:0;left:0;right:0;height:190px;border-radius:40px 40px 0 0;z-index:0;opacity:0.5}
.school-card .card-glow{position:absolute;inset:-2px;border-radius:42px;background:linear-gradient(145deg,var(--glow-color),transparent 50%,var(--glow-color));opacity:0;transition:opacity 0.5s ease;z-index:-1;filter:blur(8px)}
.school-card:hover .card-glow{opacity:0.5}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.3) 25%,rgba(255,255,255,0.1) 50%,rgba(255,255,255,0.3) 75%);background-size:200% 100%;animation:skeletonLoading 1.5s ease-in-out infinite;border-radius:40px;padding:0 24px 24px;min-height:420px}
@keyframes skeletonLoading{0%{background-position:200% 0}100%{background-position:-200% 0}}
.school-logo-area{position:relative;width:220px;height:220px;margin:0 auto;margin-top:24px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:4px solid rgba(255,255,255,0.7);box-shadow:0 8px 48px rgba(0,0,0,0.06),0 2px 12px rgba(0,0,0,0.02),inset 0 2px 0 rgba(255,255,255,0.9);transition:all 0.5s ease;transform:translateY(0);z-index:2}
.school-card:hover .school-logo-area{transform:translateY(-8px) scale(1.03);box-shadow:0 16px 56px rgba(99,102,241,0.12),0 4px 16px rgba(0,0,0,0.03),inset 0 2px 0 rgba(255,255,255,0.9)}
.school-logo-area .school-logo-img{width:100%;height:100%;object-fit:cover;animation:imageReveal 0.8s cubic-bezier(0.2,0.9,0.4,1) forwards}
@keyframes imageReveal{0%{opacity:0;transform:scale(0.7) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
.school-logo-area .logo-placeholder{font-size:64px;color:#d1d5db;font-weight:300;animation:imageReveal 0.8s cubic-bezier(0.2,0.9,0.4,1) forwards}
.school-info{position:relative;z-index:2;text-align:center;padding-top:20px}
.school-name{font-size:22px;font-weight:800;color:#0a0a1a;letter-spacing:-0.5px;line-height:1.3;text-transform:uppercase}
.school-name .prefix{font-weight:500;color:#6b7280;font-size:14px;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.school-location{font-size:16px;color:#6b7280;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;font-weight:500}
.school-percentage{font-size:20px;font-weight:800;margin-top:8px;background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block}
.school-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:16px;border-top:1.5px solid rgba(0,0,0,0.05)}
.school-rating{font-size:14px;display:flex;align-items:center;gap:6px}
.school-rating .stars{color:#f59e0b;letter-spacing:1px}
.school-rating .value{color:#6b7280;font-weight:600}
.school-code{font-size:11px;color:#9ca3af;font-family:monospace;background:rgba(241,245,249,0.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:3px 14px;border-radius:30px;letter-spacing:0.5px;border:1px solid rgba(255,255,255,0.3);font-weight:500}
.btn-access{background:linear-gradient(135deg,rgba(99,102,241,0.9),rgba(139,92,246,0.9));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);padding:8px 24px;border-radius:50px;font-size:14px;font-weight:700;color:#ffffff;cursor:pointer;transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1);display:flex;align-items:center;gap:6px;flex-shrink:0;box-shadow:0 4px 16px rgba(99,102,241,0.2)}
.btn-access:after{content:"→";transition:transform 0.4s cubic-bezier(0.2,0.9,0.4,1)}
.school-card:hover .btn-access{background:linear-gradient(135deg,#6366f1,#7c3aed);box-shadow:0 6px 24px rgba(99,102,241,0.35);transform:translateY(-2px) scale(1.04)}
.school-card:hover .btn-access:after{transform:translateX(6px)}
.btn-access:active{transform:scale(0.92)}
.no-result{text-align:center;padding:60px 20px;color:#9ca3af;font-size:16px;grid-column:1/-1;background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:36px;border:1px solid rgba(255,255,255,0.3);box-shadow:0 8px 40px rgba(0,0,0,0.04)}
@media(max-width:768px){.schools-grid{grid-template-columns:1fr 1fr;gap:28px 18px}
.school-logo-area{width:180px;height:180px;margin-top:18px}
.school-name{font-size:19px}
.school-location{font-size:14px}
.school-percentage{font-size:17px}
.main-container{padding:22px 14px 30px;top:66px}
.header{padding:10px 14px}
.search-input{font-size:14px;padding:8px 12px 8px 38px}
.btn-home{padding:6px 16px;font-size:12px}
.btn-access{font-size:12px;padding:6px 18px}}
@media(max-width:480px){.schools-grid{grid-template-columns:1fr;gap:24px}
.school-logo-area{width:200px;height:200px;margin-top:16px}
.school-logo-area .logo-placeholder{font-size:50px}
.school-card{padding:0 18px 18px;border-radius:30px}
.school-card .card-gradient{height:160px;border-radius:30px 30px 0 0}
.school-name{font-size:18px}
.school-name .prefix{font-size:12px}
.school-location{font-size:13px}
.school-percentage{font-size:16px}
.school-bottom{flex-wrap:wrap;justify-content:center;gap:8px}
.btn-access{width:100%;justify-content:center;font-size:13px;padding:8px 20px}
.main-container{padding:16px 12px 30px;top:62px}
.search-input{font-size:13px;padding:7px 10px 7px 36px}
.search-icon{font-size:13px;left:12px}
.btn-home{padding:5px 14px;font-size:11px}
.header{padding:8px 12px}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="header-fixed">
<div class="header">
<div class="search-wrap"><span class="search-icon">⌕</span><input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Effacer">✕</button></div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">🏠 Accueil</a>
</div>
</div>
<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList">
<div class="skeleton"><div class="skeleton-item"></div><div class="skeleton-item"></div><div class="skeleton-item"></div><div class="skeleton-item"></div><div class="skeleton-item"></div><div class="skeleton-item"></div></div>
</div>
</div>

<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false}return true});
document.addEventListener('selectstart',function(e){e.preventDefault();return false});
document.addEventListener('copy',function(e){e.preventDefault();return false});
document.addEventListener('cut',function(e){e.preventDefault();return false});
document.addEventListener('paste',function(e){e.preventDefault();return false});

const SCHOOLS = [
  {id:"tremplin",name:"Tremplin",city:"Kasumbalesa",logo:"tremplin.png",percentage:67},
  {id:"excellence",name:"Excellence",city:"Lubumbashi",logo:"excellence.png",percentage:66},
  {id:"source",name:"Source",city:"Lubumbashi",logo:"source.png",percentage:57},
  {id:"amour",name:"Amour",city:"Lubumbashi",logo:"amour.png",percentage:44},
  {id:"perseverance",name:"Persévérance",city:"Lubumbashi",logo:"perseverance.png",percentage:38},
  {id:"gloriadei",name:"Gloria Dei",city:"Kasumbalesa",logo:"gloriadei.png",percentage:15}
];

const COLORS = [
  {primary:'#2563eb',secondary:'#1e40af',glow:'rgba(37,99,235,0.3)'},
  {primary:'#7c3aed',secondary:'#5b21b6',glow:'rgba(124,58,237,0.3)'},
  {primary:'#0891b2',secondary:'#0e7490',glow:'rgba(8,145,178,0.3)'},
  {primary:'#059669',secondary:'#047857',glow:'rgba(5,150,105,0.3)'},
  {primary:'#d97706',secondary:'#b45309',glow:'rgba(217,119,6,0.3)'},
  {primary:'#dc2626',secondary:'#b91c1c',glow:'rgba(220,38,38,0.3)'}
];

const PLACEHOLDERS = ['⌘','✦','◈','◆','▣','◉'];
let allCards = [];
let particlesInitialized = false;

const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
if(isPWA){
  const savedSchool = localStorage.getItem('pwa_school_id');
  if(savedSchool && !window.location.search.includes('ecole')){
    const targetUrl = new URL('/', window.location.origin);
    targetUrl.searchParams.set('ecole', savedSchool);
    targetUrl.searchParams.set('from', 'pwa');
    targetUrl.searchParams.set('t', Date.now());
    window.location.href = targetUrl.toString();
    throw new Error('Redirection PWA');
  }
}

function getStars(percentage){
  const stars = Math.round(percentage / 20);
  return '★'.repeat(Math.min(stars, 5)) + '☆'.repeat(Math.max(0, 5 - stars));
}

function initParticles(){
  if(particlesInitialized) return;
  particlesInitialized = true;
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const count = Math.min(80, Math.floor((window.innerWidth * window.innerHeight) / 15000));
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      vx:(Math.random()-0.5)*0.3,
      vy:(Math.random()-0.5)*0.3,
      radius:Math.random()*2+1,
      opacity:Math.random()*0.4+0.1
    });
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      if(p.x<0||p.x>canvas.width)p.vx*=-1;
      if(p.y<0||p.y>canvas.height)p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
      ctx.fillStyle=`rgba(99,102,241,${p.opacity})`;
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize',()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
}

function generateCard(school, index){
  const safeName = school.name.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m));
  const safeCity = school.city.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m));
  const stars = getStars(school.percentage);
  const phIndex = index % PLACEHOLDERS.length;
  const colorIndex = index % COLORS.length;
  const color = COLORS[colorIndex];
  const grad = `${color.primary},${color.secondary}`;
  
  const logoHtml = school.logo 
    ? `<img class="school-logo-img" src="${school.logo}" alt="${safeName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : `<div class="logo-placeholder">${PLACEHOLDERS[phIndex]}</div>`;
  
  return {
    html: `<div class="school-card" data-prefixe="${school.id}" data-nom="${school.name.toLowerCase()}" data-ville="${school.city.toLowerCase()}" style="--primary-color:${color.primary};--secondary-color:${color.secondary};--glow-color:${color.glow}">
      <div class="card-glow"></div>
      <div class="card-gradient" style="background:linear-gradient(145deg,${grad});"></div>
      <div class="school-logo-area">${logoHtml}</div>
      <div class="school-info">
        <div class="school-name"><span class="prefix">COMPLEXE SCOLAIRE</span> ${safeName}</div>
        <div class="school-location">📍 ${safeCity}</div>
        <div class="school-percentage">${school.percentage}%</div>
        <div class="school-bottom">
          <div class="school-rating"><span class="stars">${stars}</span></div>
          <span class="school-code">${school.id}</span>
          <div class="btn-access">Accéder</div>
        </div>
      </div>
    </div>`,
    id: school.id,
    name: school.name.toLowerCase(),
    city: school.city.toLowerCase(),
    percentage: school.percentage
  };
}

function loadSchools(){
  setTimeout(()=>{
    const container = document.getElementById('schoolsList');
    const sortedByDisplay = [...SCHOOLS].sort((a,b)=>{
      if(a.id==='tremplin') return -1;
      if(b.id==='tremplin') return 1;
      return 0;
    });
    allCards = sortedByDisplay.map((school, index) => generateCard(school, index));
    renderCards(allCards);
    setupClicks();
    initParticles();
    setupParallax();
  }, 800);
}

function renderCards(cards){
  const container = document.getElementById('schoolsList');
  if(cards.length === 0){
    container.innerHTML = '<div class="no-result">Aucun établissement trouvé</div>';
    return;
  }
  container.innerHTML = cards.map(c => c.html).join('');
}

function setupSearch(){
  const input = document.getElementById('searchInput');
  const clear = document.getElementById('searchClear');
  input.addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    clear.style.display = q.length > 0 ? 'block' : 'none';
    const filtered = allCards.filter(c => c.name.includes(q) || c.city.includes(q));
    renderCards(filtered);
    setupClicks();
  });
  clear.addEventListener('click', function(){
    document.getElementById('searchInput').value = '';
    this.style.display = 'none';
    renderCards(allCards);
    setupClicks();
    document.getElementById('searchInput').focus();
  });
}

function setupClicks(){
  document.querySelectorAll('.school-card').forEach(card => {
    card.addEventListener('click', function(e){
      e.stopPropagation();
      const prefixe = this.getAttribute('data-prefixe');
      if(prefixe && prefixe !== 'null' && prefixe !== 'undefined'){
        localStorage.setItem('pwa_school_id', prefixe);
        localStorage.setItem('lastSchoolId', prefixe);
        
        // Redirection pour toutes les écoles sauf tremplin et gloriadei
        if(prefixe !== 'tremplin' && prefixe !== 'gloriadei'){
          window.location.href = 'https://www.netubex.com/accesrefus';
          return;
        }
        
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        let targetUrl;
        if(isPWA){
          const baseUrl = new URL('/', window.location.origin);
          baseUrl.searchParams.set('ecole', prefixe);
          baseUrl.searchParams.set('from', 'pwa');
          baseUrl.searchParams.set('t', Date.now());
          targetUrl = baseUrl.toString();
        } else {
          if (prefixe === 'gloriadei') {
            targetUrl = '/schooling2?ecole=' + encodeURIComponent(prefixe);
          } else {
            targetUrl = '/schooling?ecole=' + encodeURIComponent(prefixe);
          }
        }
        window.location.href = targetUrl;
      }
    });
  });
}

function setupParallax(){
  const cards = document.querySelectorAll('.school-card');
  const container = document.getElementById('mainContainer');
  container.addEventListener('mousemove', function(e){
    const rect = this.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    cards.forEach((card, i) => {
      const delay = i * 0.02;
      const rotateX = (y * 8) * (1 + delay * 0.5);
      const rotateY = (x * 8) * (1 + delay * 0.5);
      const translateY = (y * -4) * (1 + delay * 0.3);
      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(${translateY}px)`;
    });
  });
  container.addEventListener('mouseleave', function(){
    cards.forEach(card => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
    });
  });
}

loadSchools();
setupSearch();
</script>
</body>
</html>
