<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeTubeX - Itinéraire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef7ff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 92%;
            max-width: 480px;
            background: white;
            padding: 30px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            color: #1565c0;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: #172b4d;
            margin: 15px 0 25px;
        }

        .school {
            background: #e8f5e9;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 45px;
        }

        .school h2 {
            margin: 10px 0;
            font-size: 21px;
            color: #1b5e20;
        }

        .school p {
            margin: 7px 0;
            color: #455a64;
        }

        .coordinates {
            margin-top: 15px;
            padding: 12px;
            background: white;
            border-radius: 10px;
            font-size: 14px;
            color: #263238;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .info {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
            color: #607d8b;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        NeTubeX
    </div>

    <h1>🧭 ITINÉRAIRE VERS L'ÉTABLISSEMENT</h1>

    <div class="school">

        <div class="icon">🏫</div>

        <h2>ÉTABLISSEMENT TEST</h2>

        <p>📍 Kasumbalesa</p>

        <div class="coordinates">
            <strong>Coordonnées GPS</strong><br><br>

            Latitude : -12.260982<br>
            Longitude : 27.737325
        </div>

    </div>

    <a
        class="btn"
        href="https://www.google.com/maps/dir/?api=1&destination=-12.260982%2C27.737325"
        target="_blank"
        rel="noopener noreferrer"
    >
        🧭 ALLER À L'ÉTABLISSEMENT
    </a>

    <div class="info">
        📍 Votre position actuelle sera utilisée comme point de départ.<br>
        🏫 L'établissement est déjà défini comme destination.
    </div>

</div>

</body>
</html>
