<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeTubeX - Test Itinéraire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f8ff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 92%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            color: #1565c0;
        }

        h1 {
            font-size: 25px;
            margin: 20px 0;
        }

        .school {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .school h2 {
            margin-top: 0;
            font-size: 21px;
        }

        .coordinates {
            margin-top: 12px;
            font-weight: bold;
            line-height: 1.7;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #607d8b;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        NeTubeX
    </div>

    <h1>🧭 TEST D'ITINÉRAIRE</h1>

    <div class="school">

        <h2>🏫 ÉTABLISSEMENT TEST</h2>

        <div>
            📍 Kasumbalesa<br>
            République Démocratique du Congo
        </div>

        <div class="coordinates">
            Latitude : -12.21193<br>
            Longitude : 27.79512
        </div>

    </div>

    <!-- BOUTON ITINÉRAIRE -->
    <a
        class="btn"
        href="https://www.google.com/maps/dir/?api=1&destination=-12.21193%2C27.79512"
        target="_blank"
        rel="noopener noreferrer"
    >
        🧭 OBTENIR L'ITINÉRAIRE
    </a>

    <div class="note">
        Appuyez sur le bouton pour ouvrir l'itinéraire
        vers l'établissement.
    </div>

</div>

</body>
</html>
