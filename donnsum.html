<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Situation Financière</title>

<style>

/* ================================
   BASE
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(245,197,66,.08),
            transparent 35%
        ),
        #070b14;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color:#f8fafc;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:10px;
}


/* ================================
   CARTE
================================ */

.container{
    width:100%;
    max-width:720px;
}

.card{

    width:100%;

    background:
        linear-gradient(
            145deg,
            #121b2b,
            #0b1220
        );

    border:1px solid rgba(245,197,66,.14);

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);

    animation:appear .45s ease;
}

@keyframes appear{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


/* ================================
   HEADER
================================ */

.header{

    min-height:62px;

    padding:10px 16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.header-left{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;
}

.logo{

    width:36px;
    height:36px;

    flex-shrink:0;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:17px;

    background:
        linear-gradient(
            145deg,
            rgba(245,197,66,.2),
            rgba(245,197,66,.04)
        );

    border:
        1px solid
        rgba(245,197,66,.18);
}

.title{

    min-width:0;
}

.title h1{

    font-size:16px;

    font-weight:800;

    letter-spacing:-.3px;

    white-space:nowrap;
}

.title p{

    margin-top:2px;

    color:#64748b;

    font-size:7px;

    letter-spacing:.5px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.global-rate{

    font-size:20px;

    font-weight:900;

    color:#f5c542;

    white-space:nowrap;
}


/* ================================
   LIGNE FINANCIÈRE
================================ */

.finance-row{

    display:grid;

    grid-template-columns:1fr 1fr;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.finance-cell{

    min-height:57px;

    padding:9px 14px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}

.finance-cell + .finance-cell{

    border-left:
        1px solid
        rgba(255,255,255,.06);

}

.finance-label{

    color:#64748b;

    font-size:7px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.6px;

    margin-bottom:3px;
}

.finance-value{

    font-size:14px;

    font-weight:800;
}

.students{

    color:#f5c542;
}

.paid{

    color:#22c55e;
}

.remaining{

    color:#f59e0b;
}


/* ================================
   CLASSES
================================ */

.classes{

    display:grid;

    grid-template-columns:1fr 1fr;

}

.class-cell{

    min-height:54px;

    padding:8px 13px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    background:rgba(255,255,255,.012);

    border-bottom:
        1px solid
        rgba(255,255,255,.055);
}

.class-cell:nth-child(odd){

    border-right:
        1px solid
        rgba(255,255,255,.055);
}

.class-cell:nth-child(5),
.class-cell:nth-child(6){

    border-bottom:none;
}


/* classe + pourcentage */

.class-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:5px;
}

.class-name{

    font-size:9px;

    font-weight:750;

    color:#e2e8f0;
}

.class-rate{

    font-size:11px;

    font-weight:900;
}


/* ================================
   BARRE
================================ */

.bar{

    width:100%;

    height:4px;

    background:#1e293b;

    border-radius:20px;

    overflow:hidden;
}

.bar-fill{

    height:100%;

    border-radius:20px;

    transition:
        width 1s
        cubic-bezier(.2,.8,.2,1);
}


/* COULEURS */

.high{

    color:#22c55e;
}

.high-fill{

    background:#22c55e;

    box-shadow:
        0 0 8px
        rgba(34,197,94,.25);
}

.medium{

    color:#f59e0b;
}

.medium-fill{

    background:#f59e0b;

    box-shadow:
        0 0 8px
        rgba(245,158,11,.2);
}

.low{

    color:#ef4444;
}

.low-fill{

    background:#ef4444;

    box-shadow:
        0 0 8px
        rgba(239,68,68,.2);
}


/* ================================
   FOOTER
================================ */

.footer{

    min-height:38px;

    padding:7px 14px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    color:#64748b;

    font-size:7px;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}

.close{

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color:#94a3b8;

    padding:5px 10px;

    border-radius:20px;

    font-size:7px;

    cursor:pointer;

    transition:.2s;
}

.close:hover{

    color:#f5c542;

    border-color:
        rgba(245,197,66,.25);

    background:
        rgba(245,197,66,.07);
}


/* ================================
   PETIT TÉLÉPHONE
================================ */

@media(max-width:390px){

    body{
        padding:6px;
    }

    .card{
        border-radius:16px;
    }

    .header{
        min-height:54px;

        padding:8px 11px;
    }

    .logo{
        width:30px;
        height:30px;

        font-size:14px;

        border-radius:8px;
    }

    .title h1{
        font-size:13px;
    }

    .title p{
        font-size:6px;
    }

    .global-rate{
        font-size:17px;
    }

    .finance-cell{
        min-height:50px;

        padding:7px 10px;
    }

    .finance-label{
        font-size:6px;
    }

    .finance-value{
        font-size:12px;
    }

    .class-cell{
        min-height:48px;

        padding:7px 10px;
    }

    .class-name{
        font-size:8px;
    }

    .class-rate{
        font-size:10px;
    }

    .bar{
        height:3px;
    }

    .footer{
        min-height:32px;

        padding:5px 10px;
    }

}


/* ================================
   TRÈS PETIT ÉCRAN
================================ */

@media(max-width:390px) and (max-height:650px){

    .header{
        min-height:48px;
    }

    .logo{
        width:27px;
        height:27px;
    }

    .finance-cell{
        min-height:44px;
    }

    .class-cell{
        min-height:43px;
    }

    .footer{
        min-height:28px;
    }

}

</style>
</head>


<body>


<div class="container">

<div class="card">


<!-- ================================
     HEADER
================================ -->

<div class="header">

    <div class="header-left">

        <div class="logo">
            📊
        </div>

        <div class="title">

            <h1>
                SITUATION FINANCIÈRE
            </h1>

            <p>
                COMPLEXE SCOLAIRE KINSHASA · 2026-2027
            </p>

        </div>

    </div>

    <div
        class="global-rate"
        id="globalRate">
        72%
    </div>

</div>


<!-- ================================
     INFORMATIONS FINANCIÈRES
================================ -->

<div class="finance-row">


    <div class="finance-cell">

        <div class="finance-label">
            👨‍🎓 Élèves
        </div>

        <div
            class="finance-value students">
            63
        </div>

    </div>


    <div class="finance-cell">

        <div class="finance-label">
            💰 Montant encaissé
        </div>

        <div
            class="finance-value paid">
            4 500 000 FC
        </div>

    </div>

</div>


<div class="finance-row">


    <div class="finance-cell">

        <div class="finance-label">
            ⚠ Reste
        </div>

        <div
            class="finance-value remaining">
            1 750 000 FC
        </div>

    </div>


    <div class="finance-cell">

        <div class="finance-label">
            📋 Total attendu
        </div>

        <div
            class="finance-value"
            style="color:#cbd5e1;">
            6 250 000 FC
        </div>

    </div>

</div>


<!-- ================================
     CLASSES
================================ -->

<div class="classes">


<!-- 7ème -->

<div class="class-cell">

    <div class="class-top">

        <span class="class-name">
            7ème EB
        </span>

        <span class="class-rate high">
            85%
        </span>

    </div>

    <div class="bar">

        <div
            class="bar-fill high-fill"
            style="width:85%;">
        </div>

    </div>

</div>


<!-- 8ème -->

<div class="class-cell">

    <div class="class-top">

        <span class="class-name">
            8ème EB
        </span>

        <span class="class-rate high">
            78%
        </span>

    </div>

    <div class="bar">

        <div
            class="bar-fill high-fill"
            style="width:78%;">
        </div>

    </div>

</div>


<!-- 1ère -->

<div class="class-cell">

    <div class="class-top">

        <span class="class-name">
            1ère Année
        </span>

        <span class="class-rate medium">
            65%
        </span>

    </div>

    <div class="bar">

        <div
            class="bar-fill medium-fill"
            style="width:65%;">
        </div>

    </div>

</div>


<!-- 2ème -->

<div class="class-cell">

    <div class="class-top">

        <span class="class-name">
            2ème Année
        </span>

        <span class="class-rate medium">
            55%
        </span>

    </div>

    <div class="bar">

        <div
            class="bar-fill medium-fill"
            style="width:55%;">
        </div>

    </div>

</div>


<!-- 3ème -->

<div class="class-cell">

    <div class="class-top">

        <span class="class-name">
            3ème Année
        </span>

        <span class="class-rate low">
            45%
        </span>

    </div>

    <div class="bar">

        <div
            class="bar-fill low-fill"
            style="width:45%;">
        </div>

    </div>

</div>


<!-- 4ème -->

<div class="class-cell">

    <div class="class-top">

        <span class="class-name">
            4ème Année
        </span>

        <span class="class-rate low">
            35%
        </span>

    </div>

    <div class="bar">

        <div
            class="bar-fill low-fill"
            style="width:35%;">
        </div>

    </div>

</div>


</div>


<!-- ================================
     FOOTER
================================ -->

<div class="footer">

    <span>
        📅 Mise à jour :
        <span id="dateUpdate"></span>
    </span>

    <button
        class="close"
        onclick="fermer()">
        ✕ Fermer
    </button>

</div>


</div>

</div>


<script>

/* ================================
   DATE
================================ */

document.getElementById(
    "dateUpdate"
).textContent =
    new Date().toLocaleDateString(
        "fr-FR",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );


/* ================================
   FERMER
================================ */

function fermer(){

    const card =
        document.querySelector(".card");

    card.style.transition =
        ".25s ease";

    card.style.opacity="0";

    card.style.transform=
        "scale(.96)";

    setTimeout(function(){

        card.style.display="none";

    },250);

}

</script>

</body>
</html>
