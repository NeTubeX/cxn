<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport Financier</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'Courier New',monospace;padding:20px;display:flex;justify-content:center;min-height:100vh}
.container{max-width:900px;width:100%;background:rgba(18,18,31,0.95);border-radius:20px;padding:30px;border:1px solid rgba(255,215,0,0.2)}
.header{text-align:center;margin-bottom:25px;padding-bottom:20px;border-bottom:2px solid rgba(255,215,0,0.2)}
.header h1{color:#ffd700;font-size:22px;font-weight:700}
.header .sub{color:#94a3b8;font-size:12px;margin-top:5px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:25px}
.stat-card{background:rgba(15,23,42,0.8);border-radius:14px;padding:16px;text-align:center;border:1px solid rgba(255,215,0,0.1)}
.stat-card .number{font-size:26px;font-weight:700;color:#ffd700}
.stat-card .number.green{color:#10b981}
.stat-card .number.orange{color:#f59e0b}
.stat-card .number.red{color:#ef4444}
.stat-card .label{font-size:10px;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
.rapport{font-family:'Courier New',monospace;font-size:13px;line-height:1.8;color:#e2e8f0;background:rgba(0,0,0,0.3);border-radius:12px;padding:20px;white-space:pre-wrap;overflow-x:auto}
.rapport .title{color:#ffd700;font-weight:bold}
.rapport .highlight{color:#10b981}
.rapport .warning{color:#f59e0b}
.rapport .danger{color:#ef4444}
.rapport .barre{color:#3b82f6}
.rapport .separator{color:#334155}
.footer{margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,215,0,0.1);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b}
.btn-regen{background:rgba(255,215,0,0.15);border:1px solid rgba(255,215,0,0.3);color:#ffd700;padding:8px 20px;border-radius:30px;cursor:pointer;font-size:12px;font-family:'Courier New',monospace;transition:all 0.3s}
.btn-regen:hover{background:rgba(255,215,0,0.25)}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📊 SITUATION FINANCIÈRE</h1>
<div class="sub">COMPLEXE SCOLAIRE KINSHASA - Année 2026-2027</div>
</div>
<div class="stats-grid">
<div class="stat-card"><div class="number" id="statTotal">63</div><div class="label">Total Élèves</div></div>
<div class="stat-card"><div class="number green" id="statTaux">72%</div><div class="label">Taux Recouvrement</div></div>
<div class="stat-card"><div class="number orange" id="statReste">1 750 000 FC</div><div class="label">Reste à Payer</div></div>
<div class="stat-card"><div class="number red" id="statImpayes">12</div><div class="label">Élèves Impayés</div></div>
</div>
<div class="rapport" id="rapportContainer"></div>
<div class="footer">
<span>📅 <span id="dateUpdate">15 Septembre 2026</span></span>
<button class="btn-regen" onclick="genererRapport()">⟳ Actualiser</button>
</div>
</div>

<script>
const donnees = {
    nomEcole: 'COMPLEXE SCOLAIRE KINSHASA',
    totalEleves: 63,
    totalMinerval: 6250000,
    totalPaye: 4500000,
    reste: 1750000,
    taux: 72,
    elevesImpayes: 12,
    parClasse: {
        '7ème EB': { taux: 85, count: 21 },
        '8ème EB': { taux: 78, count: 18 },
        '1ère Année': { taux: 65, count: 15 },
        '2ème Année': { taux: 55, count: 14 },
        '3ème Année': { taux: 45, count: 12 },
        '4ème Année': { taux: 35, count: 10 }
    }
};

function genererBarre(taux) {
    const nb = Math.round(taux / 4);
    let barre = '';
    for (let i = 0; i < nb; i++) barre += '█';
    for (let i = nb; i < 25; i++) barre += '░';
    return barre;
}

function genererRapport() {
    const d = donnees;
    let html = '';
    html += '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
    html += '📊 SITUATION FINANCIÈRE - ' + d.nomEcole + '\n';
    html += '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
    html += '💰 RECOUVREMENT GLOBAL\n';
    html += '   Taux : ' + d.taux + '% (' + d.totalPaye.toLocaleString() + ' FC encaissés sur ' + d.totalMinerval.toLocaleString() + ' FC)\n';
    html += '   Reste : ' + d.reste.toLocaleString() + ' FC\n\n';
    html += '📊 PAR CLASSE :\n';
    const classes = ['7ème EB', '8ème EB', '1ère Année', '2ème Année', '3ème Année', '4ème Année'];
    for (const classe of classes) {
        const data = d.parClasse[classe];
        if (!data) continue;
        const barre = genererBarre(data.taux);
        const pourcent = data.taux.toString().padStart(3, ' ');
        const count = data.count.toString().padStart(2, ' ');
        html += '   ' + classe.padEnd(12) + ' : ' + pourcent + '%  ' + barre + '  (' + count + ' élèves)\n';
    }
    html += '\n';
    let pireClasse = '', pireTaux = 100;
    let meilleureClasse = '', meilleurTaux = 0;
    for (const classe of classes) {
        const data = d.parClasse[classe];
        if (data) {
            if (data.taux > meilleurTaux) { meilleurTaux = data.taux; meilleureClasse = classe; }
            if (data.taux < pireTaux) { pireTaux = data.taux; pireClasse = classe; }
        }
    }
    html += '⚠️ POINTS D\'ATTENTION :\n';
    html += '   • ' + d.elevesImpayes + ' élèves en retard de paiement (3 mois +)\n';
    if (pireClasse) html += '   • ' + pireClasse + ' : taux le plus bas (' + pireTaux + '%)\n';
    if (meilleureClasse) html += '   • ' + meilleureClasse + ' : meilleur taux (' + meilleurTaux + '%)\n';
    html += '\n📌 RECOMMANDATIONS :\n';
    let num = 1;
    if (d.taux < 60) {
        html += '   ' + num + '. Mettre en place un suivi hebdomadaire des paiements\n';
        num++;
    }
    if (d.elevesImpayes > 10) {
        html += '   ' + num + '. Contacter les parents des ' + d.elevesImpayes + ' élèves en retard\n';
        num++;
    }
    html += '   ' + num + '. Vérifier les exonérations dans les classes à faible taux\n';
    num++;
    html += '   ' + num + '. Organiser une réunion avec les représentants des classes problématiques\n';
    html += '\n📅 ' + new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return html;
}

function afficherRapport() {
    const container = document.getElementById('rapportContainer');
    container.textContent = genererRapport();
    document.getElementById('statTotal').textContent = donnees.totalEleves;
    document.getElementById('statTaux').textContent = donnees.taux + '%';
    document.getElementById('statReste').textContent = donnees.reste.toLocaleString() + ' FC';
    document.getElementById('statImpayes').textContent = donnees.elevesImpayes;
    document.getElementById('dateUpdate').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

document.addEventListener('DOMContentLoaded', afficherRapport);
</script>
</body>
</html>
