<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · NeTubeX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#0a1628 0%,#0f2942 40%,#0d1f35 70%,#0a1628 100%);font-family:'Inter',sans-serif;padding:20px}
.login-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:32px;padding:40px 36px;max-width:400px;width:100%;border:1px solid rgba(255,255,255,0.08);box-shadow:0 40px 100px rgba(0,0,0,0.4)}
.login-card .logo{text-align:center;margin-bottom:20px}
.login-card .logo .icon{font-size:48px;background:linear-gradient(135deg,#6C63FF,#4A42D4);width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto;color:#fff;font-weight:900;font-size:28px}
.login-card h1{color:#fff;font-size:22px;font-weight:800;text-align:center;margin-bottom:2px}
.login-card .sub{color:rgba(255,255,255,0.4);font-size:13px;text-align:center;margin-bottom:20px}
.login-card .sub strong{color:#6C63FF}
.sources-info{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.sources-info .badge{padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600}
.sources-info .badge.a{background:rgba(59,130,246,0.15);color:#3b82f6;border:1px solid rgba(59,130,246,0.2)}
.sources-info .badge.b{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.2)}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:rgba(255,255,255,0.4);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.form-group input{width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.06);color:#fff;font-size:15px;outline:none;transition:all 0.3s ease;font-family:'Inter',sans-serif}
.form-group input:focus{border-color:#6C63FF;background:rgba(255,255,255,0.08);box-shadow:0 0 0 4px rgba(108,99,255,0.06)}
.form-group input::placeholder{color:rgba(255,255,255,0.2)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6C63FF,#4A42D4);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 30px rgba(108,99,255,0.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(108,99,255,0.35)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn .spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#f87171;font-size:13px;text-align:center;min-height:20px;margin-top:8px}
.success{color:#34d399;font-size:13px;text-align:center;min-height:20px;margin-top:8px}
.info{color:rgba(255,255,255,0.3);font-size:11px;text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.04)}
.info a{color:#6C63FF;text-decoration:none}
.status-box{background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 16px;margin:12px 0;border:1px solid rgba(255,255,255,0.06)}
.status-box .status-item{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:rgba(255,255,255,0.5)}
.status-box .status-item .check{font-weight:700}
.status-box .status-item .check.success{color:#34d399}
.status-box .status-item .check.fail{color:#f87171}
.status-box .status-item .check.waiting{color:rgba(255,255,255,0.2)}
</style>
</head>
<body>

<div class="login-card">
<div class="logo"><div class="icon">N</div></div>
<h1>🔐 Admin Login</h1>
<p class="sub">Accès aux <strong>SOURCE A</strong> et <strong>SOURCE B</strong></p>

<div class="sources-info">
<span class="badge a">🔵 SOURCE A</span>
<span class="badge b">🟢 SOURCE B</span>
</div>

<div class="form-group">
<label>📧 Email</label>
<input type="email" id="loginEmail" placeholder="admin@netubex.com">
</div>

<div class="form-group">
<label>🔑 Mot de passe</label>
<input type="password" id="loginPassword" placeholder="Entrez votre mot de passe">
</div>

<div class="status-box" id="statusBox" style="display:none;">
<div class="status-item"><span>🔵 SOURCE A</span><span class="check waiting" id="statusA">⏳ Connexion...</span></div>
<div class="status-item"><span>🟢 SOURCE B</span><span class="check waiting" id="statusB">⏳ Connexion...</span></div>
</div>

<button class="btn" id="loginBtn">
<span class="spinner"></span>
<span class="btn-text">🔓 SE CONNECTER</span>
</button>

<div id="loginError" class="error"></div>
<div id="loginSuccess" class="success"></div>

<div class="info">
📝 Pas de compte ? <a href="register_admin.html">Inscrivez-vous</a>
</div>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"}}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword } from "firebase/auth";

const firebaseConfigA = {
apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
authDomain: "gesco-67c43.firebaseapp.com",
projectId: "gesco-67c43",
storageBucket: "gesco-67c43.firebasestorage.app",
messagingSenderId: "333004443566",
appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const firebaseConfigB = {
apiKey: "AIzaSyBma80S0bc9uzSuO38qn7JLSwLrYniV5Fw",
authDomain: "gesco-2.firebaseapp.com",
projectId: "gesco-2",
storageBucket: "gesco-2.firebasestorage.app",
messagingSenderId: "36319988765",
appId: "1:36319988765:web:e8cd823804596495248af4"
};

const appA = initializeApp(firebaseConfigA, 'sourceA');
const appB = initializeApp(firebaseConfigB, 'sourceB');

const authA = getAuth(appA);
const authB = getAuth(appB);

const loginBtn = document.getElementById('loginBtn');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginError = document.getElementById('loginError');
const loginSuccess = document.getElementById('loginSuccess');
const statusBox = document.getElementById('statusBox');
const statusA = document.getElementById('statusA');
const statusB = document.getElementById('statusB');

async function loginAdmin(email, password) {
    let connectedA = false;
    let connectedB = false;
    let userA = null;
    let userB = null;

    statusBox.style.display = 'block';
    statusA.textContent = '⏳ Connexion...';
    statusA.className = 'check waiting';
    statusB.textContent = '⏳ Connexion...';
    statusB.className = 'check waiting';

    try {
        const credA = await signInWithEmailAndPassword(authA, email, password);
        userA = credA.user;
        connectedA = true;
        statusA.textContent = '✅ Connecté';
        statusA.className = 'check success';
    } catch (e) {
        statusA.textContent = '❌ ' + e.message;
        statusA.className = 'check fail';
    }

    try {
        const credB = await signInWithEmailAndPassword(authB, email, password);
        userB = credB.user;
        connectedB = true;
        statusB.textContent = '✅ Connecté';
        statusB.className = 'check success';
    } catch (e) {
        statusB.textContent = '❌ ' + e.message;
        statusB.className = 'check fail';
    }

    if (connectedA && connectedB) {
        return { success: true, message: '✅ Connecté aux DEUX projets', userA, userB, both: true };
    } else if (connectedA) {
        return { success: true, message: '⚠️ Connecté UNIQUEMENT à SOURCE A', userA, userB: null, both: false };
    } else if (connectedB) {
        return { success: true, message: '⚠️ Connecté UNIQUEMENT à SOURCE B', userA: null, userB, both: false };
    } else {
        return { success: false, message: '❌ Aucun compte Admin trouvé' };
    }
}

async function handleLogin() {
    const email = loginEmail.value.trim();
    const password = loginPassword.value.trim();

    loginError.textContent = '';
    loginSuccess.textContent = '';
    statusBox.style.display = 'none';

    if (!email || !password) {
        loginError.textContent = '❌ Veuillez remplir tous les champs';
        return;
    }

    loginBtn.disabled = true;
    loginBtn.classList.add('loading');

    try {
        const result = await loginAdmin(email, password);

        if (result.success) {
            loginSuccess.textContent = result.message;
            loginError.textContent = '';

            window.adminSession = {
                email: email,
                sourceA: result.userA ? { uid: result.userA.uid } : null,
                sourceB: result.userB ? { uid: result.userB.uid } : null,
                both: result.both,
                timestamp: Date.now()
            };

            sessionStorage.setItem('adminSession', JSON.stringify(window.adminSession));

            setTimeout(() => {
                window.location.href = 'https://www.netubex.com/desiadmin?admin=true&email=' + encodeURIComponent(email);
            }, 1500);
        } else {
            loginError.textContent = result.message;
            loginSuccess.textContent = '';
        }
    } catch (error) {
        loginError.textContent = '❌ Erreur: ' + error.message;
    } finally {
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
    }
}

loginBtn.addEventListener('click', handleLogin);

loginPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
});

loginEmail.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginPassword.focus();
});

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('registered') === 'true') {
    const successMsg = document.createElement('div');
    successMsg.style.cssText = 'background:rgba(52,211,153,0.10);border:1px solid rgba(52,211,153,0.2);border-radius:12px;padding:12px;text-align:center;margin-bottom:16px;color:#34d399;font-size:14px;font-weight:600;';
    successMsg.textContent = '✅ Compte créé avec succès ! Connectez-vous.';
    document.querySelector('.login-card').insertBefore(successMsg, document.querySelector('.form-group'));
}

console.log('🔐 Admin Login prêt');
console.log('📁 SOURCE A:', firebaseConfigA.projectId);
console.log('📁 SOURCE B:', firebaseConfigB.projectId);
console.log('🔗 Redirection vers: https://www.netubex.com/desiadmin');
</script>
</body>
</html>
