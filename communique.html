<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoi communiqué</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0e1a;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        label {
            color: #aaa;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #0a0a1a;
            color: #fff;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        select {
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        .msg.ok {
            display: block;
            background: #064e3b;
            color: #6ee7b7;
            border: 1px solid #065f46;
        }
        .msg.err {
            display: block;
            background: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #991b1b;
        }
        .msg.load {
            display: block;
            background: #1e3a5f;
            color: #93c5fd;
            border: 1px solid #1e40af;
        }
        .info {
            color: #888;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }
        .back:hover {
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>📢 Envoyer un communiqué</h2>
    
    <form id="formComm">
        <label>Titre *</label>
        <input type="text" id="titre" placeholder="Ex: Réunion parents" required>
        
        <label>Message *</label>
        <textarea id="contenu" placeholder="Écrivez votre communiqué..." required></textarea>
        
        <label>Priorité</label>
        <select id="priorite">
            <option value="basse">🟢 Basse (info)</option>
            <option value="moyenne" selected>🟡 Moyenne (important)</option>
            <option value="haute">🔴 Haute (urgent)</option>
        </select>
        
        <div class="info">👥 Visible par TOUS les parents</div>
        
        <button type="submit" id="btnEnvoyer">📤 Envoyer</button>
    </form>
    
    <div id="status" class="msg"></div>
    
    <a href="#" class="back" id="backLink">← Retour</a>
</div>

<script>
    // Configuration Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
        authDomain: "gesco-67c43.firebaseapp.com",
        projectId: "gesco-67c43",
        storageBucket: "gesco-67c43.firebasestorage.app",
        messagingSenderId: "333004443566",
        appId: "1:333004443566:web:de41f60000e418dce9023f"
    };

    // Récupérer l'école depuis l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const ecoleId = urlParams.get('ecole');
    
    if (!ecoleId) {
        document.getElementById('status').className = 'msg err';
        document.getElementById('status').textContent = '❌ École non spécifiée. Ajoutez ?ecole=nom dans l\'URL';
        document.getElementById('status').style.display = 'block';
        document.getElementById('btnEnvoyer').disabled = true;
    }

    // Initialiser Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('formComm');
    const status = document.getElementById('status');
    const btn = document.getElementById('btnEnvoyer');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const titre = document.getElementById('titre').value.trim();
        const contenu = document.getElementById('contenu').value.trim();
        const priorite = document.getElementById('priorite').value;
        
        if (!titre || !contenu) {
            status.className = 'msg err';
            status.textContent = '⚠️ Titre et contenu obligatoires';
            status.style.display = 'block';
            return;
        }
        
        // Désactiver le bouton
        btn.disabled = true;
        btn.textContent = '⏳ Envoi...';
        
        status.className = 'msg load';
        status.textContent = '📤 Envoi en cours...';
        status.style.display = 'block';
        
        try {
            const data = {
                titre: titre,
                contenu: contenu,
                priorite: priorite,
                date: new Date().toISOString(),
                actif: true,
                publiePar: 'Administration'
            };
            
            await addDoc(collection(db, "ecoles", ecoleId, "communiques"), data);
            
            status.className = 'msg ok';
            status.textContent = '✅ Communiqué envoyé avec succès !';
            status.style.display = 'block';
            
            form.reset();
            
            // Réactiver après 3s
            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = '📤 Envoyer';
            }, 3000);
            
        } catch (error) {
            status.className = 'msg err';
            status.textContent = '❌ Erreur : ' + error.message;
            status.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '📤 Envoyer';
        }
    });

    // Retour vers l'espace parental
    document.getElementById('backLink').onclick = (e) => {
        e.preventDefault();
        if (ecoleId) {
            window.location.href = `/?ecole=${ecoleId}`;
        } else {
            window.location.href = '/';
        }
    };
</script>

</body>
</html>
