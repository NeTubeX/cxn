<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoi communiqué</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0e1a;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }
        label {
            color: #aaa;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #0a0a1a;
            color: #fff;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        select {
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        .msg.ok {
            display: block;
            background: #064e3b;
            color: #6ee7b7;
            border: 1px solid #065f46;
        }
        .msg.err {
            display: block;
            background: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #991b1b;
        }
        .msg.load {
            display: block;
            background: #1e3a5f;
            color: #93c5fd;
            border: 1px solid #1e40af;
        }
        .info {
            color: #888;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        .back:hover {
            color: #aaa;
        }
        .hidden {
            display: none !important;
        }
        .user-info {
            color: #6ee7b7;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
            padding: 8px;
            background: #064e3b;
            border-radius: 8px;
        }
        .logout-btn {
            background: #dc2626;
            margin-top: 10px;
            font-size: 13px;
            padding: 8px;
        }
        .logout-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>🔐 Connexion</h2>
    <p style="color:#888;text-align:center;font-size:14px;margin-bottom:20px;">Accès à l'envoi de communiqués</p>
    
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="admin@ecole.com" value="admin@ecole.com">
    
    <label>Mot de passe</label>
    <input type="password" id="loginPassword" placeholder="Votre mot de passe">
    
    <button id="loginBtn">🔑 Se connecter</button>
    
    <div id="loginStatus" class="msg"></div>
    
    <a class="back" id="backLogin">← Retour</a>
</div>

<!-- Formulaire d'envoi (caché au départ) -->
<div class="box hidden" id="formBox">
    <h2>📢 Envoyer un communiqué</h2>
    
    <div id="userInfo" class="user-info">👤 Connecté</div>
    
    <form id="formComm">
        <label>Titre *</label>
        <input type="text" id="titre" placeholder="Ex: Réunion parents" required>
        
        <label>Message *</label>
        <textarea id="contenu" placeholder="Écrivez votre communiqué..." required></textarea>
        
        <label>Priorité</label>
        <select id="priorite">
            <option value="basse">🟢 Basse (info)</option>
            <option value="moyenne" selected>🟡 Moyenne (important)</option>
            <option value="haute">🔴 Haute (urgent)</option>
        </select>
        
        <div class="info">👥 Visible par TOUS les parents</div>
        
        <button type="submit" id="btnEnvoyer">📤 Envoyer</button>
        
        <button type="button" id="logoutBtn" class="logout-btn">🚪 Se déconnecter</button>
    </form>
    
    <div id="status" class="msg"></div>
    
    <a class="back" id="backForm">← Retour</a>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
import { getFirestore, collection, addDoc } from "firebase/firestore";

// Configuration Firebase
const firebaseConfig = {
    apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
    authDomain: "gesco-67c43.firebaseapp.com",
    projectId: "gesco-67c43",
    storageBucket: "gesco-67c43.firebasestorage.app",
    messagingSenderId: "333004443566",
    appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Récupérer l'école depuis l'URL
const urlParams = new URLSearchParams(window.location.search);
const ecoleId = urlParams.get('ecole');

// Références DOM
const loginBox = document.getElementById('loginBox');
const formBox = document.getElementById('formBox');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginStatus = document.getElementById('loginStatus');
const logoutBtn = document.getElementById('logoutBtn');
const userInfo = document.getElementById('userInfo');
const form = document.getElementById('formComm');
const status = document.getElementById('status');
const btn = document.getElementById('btnEnvoyer');
const backLogin = document.getElementById('backLogin');
const backForm = document.getElementById('backForm');

// Vérifier l'école
if (!ecoleId) {
    loginStatus.className = 'msg err';
    loginStatus.textContent = '❌ École non spécifiée. Ajoutez ?ecole=nom dans l\'URL';
    loginStatus.style.display = 'block';
    loginBtn.disabled = true;
}

// Afficher formulaire si déjà connecté
onAuthStateChanged(auth, (user) => {
    if (user) {
        loginBox.classList.add('hidden');
        formBox.classList.remove('hidden');
        userInfo.textContent = `👤 Connecté : ${user.email}`;
        document.getElementById('titre').focus();
    } else {
        loginBox.classList.remove('hidden');
        formBox.classList.add('hidden');
        loginEmail.value = '';
        loginPassword.value = '';
    }
});

// Connexion
loginBtn.addEventListener('click', async () => {
    const email = loginEmail.value.trim();
    const password = loginPassword.value.trim();
    
    if (!email || !password) {
        loginStatus.className = 'msg err';
        loginStatus.textContent = '⚠️ Email et mot de passe requis';
        loginStatus.style.display = 'block';
        return;
    }
    
    loginBtn.disabled = true;
    loginBtn.textContent = '⏳ Connexion...';
    loginStatus.className = 'msg load';
    loginStatus.textContent = '🔐 Connexion en cours...';
    loginStatus.style.display = 'block';
    
    try {
        await signInWithEmailAndPassword(auth, email, password);
        loginStatus.className = 'msg ok';
        loginStatus.textContent = '✅ Connecté !';
        loginStatus.style.display = 'block';
        loginBtn.textContent = '🔑 Se connecter';
        loginBtn.disabled = false;
    } catch (error) {
        loginStatus.className = 'msg err';
        let msg = '❌ Email ou mot de passe incorrect';
        if (error.code === 'auth/user-not-found') msg = '❌ Utilisateur non trouvé';
        if (error.code === 'auth/wrong-password') msg = '❌ Mot de passe incorrect';
        if (error.code === 'auth/invalid-email') msg = '❌ Email invalide';
        if (error.code === 'auth/too-many-requests') msg = '❌ Trop de tentatives. Réessayez plus tard.';
        loginStatus.textContent = msg;
        loginStatus.style.display = 'block';
        loginBtn.textContent = '🔑 Se connecter';
        loginBtn.disabled = false;
    }
});

// Déconnexion
logoutBtn.addEventListener('click', async () => {
    await signOut(auth);
    status.className = 'msg';
    status.style.display = 'none';
});

// Retour
backLogin.addEventListener('click', () => {
    if (ecoleId) {
        window.location.href = `/?ecole=${ecoleId}`;
    } else {
        window.location.href = '/';
    }
});

backForm.addEventListener('click', () => {
    if (ecoleId) {
        window.location.href = `/?ecole=${ecoleId}`;
    } else {
        window.location.href = '/';
    }
});

// Envoi du communiqué
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const titre = document.getElementById('titre').value.trim();
    const contenu = document.getElementById('contenu').value.trim();
    const priorite = document.getElementById('priorite').value;
    
    if (!titre || !contenu) {
        status.className = 'msg err';
        status.textContent = '⚠️ Titre et contenu obligatoires';
        status.style.display = 'block';
        return;
    }
    
    btn.disabled = true;
    btn.textContent = '⏳ Envoi...';
    status.className = 'msg load';
    status.textContent = '📤 Envoi en cours...';
    status.style.display = 'block';
    
    try {
        const data = {
            titre: titre,
            contenu: contenu,
            priorite: priorite,
            date: new Date().toISOString(),
            actif: true,
            publiePar: auth.currentUser?.email || 'Administration'
        };
        
        await addDoc(collection(db, "ecoles", ecoleId, "communiques"), data);
        
        status.className = 'msg ok';
        status.textContent = '✅ Communiqué envoyé avec succès !';
        status.style.display = 'block';
        
        form.reset();
        
        setTimeout(() => {
            btn.disabled = false;
            btn.textContent = '📤 Envoyer';
        }, 3000);
        
    } catch (error) {
        status.className = 'msg err';
        status.textContent = '❌ Erreur : ' + error.message;
        status.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '📤 Envoyer';
    }
});

// Enter pour se connecter
loginPassword.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loginBtn.click();
});
loginEmail.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loginBtn.click();
});
</script>

</body>
</html>
