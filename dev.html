<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESPACE PRIMAIRE & MATERNELLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:linear-gradient(135deg,#0a0a1a,#1a1a3e);color:#fff;min-height:100vh;padding:16px;padding-bottom:80px}
        .header{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:16px 20px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.06)}
        .header h1{font-size:20px;font-weight:800;color:#ffd700}
        .header h1 span{font-weight:400;font-size:14px;color:rgba(255,255,255,0.4)}
        .header .sub{font-size:13px;color:rgba(255,255,255,0.3);margin-top:4px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
        .stat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;text-align:center}
        .stat-card .num{font-size:22px;font-weight:900;color:#ffd700}
        .stat-card .label{font-size:10px;color:rgba(255,255,255,0.3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
        .stat-card .num.blue{color:#5dade2}
        .stat-card .num.green{color:#2ecc71}
        .stat-card .num.pink{color:#ec4899}
        .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
        .filters input,.filters select{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:#fff;font-size:13px;outline:none;flex:1;min-width:140px}
        .filters input::placeholder{color:rgba(255,255,255,0.2)}
        .filters select option{background:#1a1a3e;color:#fff}
        .school-group{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:12px;margin-bottom:12px;overflow:hidden}
        .school-group .school-header{padding:10px 16px;background:rgba(255,255,255,0.02);font-weight:700;font-size:14px;color:#fff;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center}
        .school-group .school-header .badge{font-size:11px;font-weight:400;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.04);padding:2px 12px;border-radius:20px}
        .school-group .section-title{padding:6px 16px 4px 16px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.2);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(255,255,255,0.02)}
        .eleve-item{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;border-bottom:1px solid rgba(255,255,255,0.02)}
        .eleve-item:hover{background:rgba(255,255,255,0.02)}
        .eleve-item .nom{font-weight:600;font-size:14px;color:#fff}
        .eleve-item .classe{font-size:12px;color:rgba(255,255,255,0.3);margin-left:8px}
        .eleve-item .code{font-family:monospace;font-size:14px;color:#2ecc71;background:rgba(46,204,113,0.10);padding:2px 12px;border-radius:4px;font-weight:700}
        .eleve-item .badge-section{font-size:10px;font-weight:700;padding:2px 10px;border-radius:12px;margin-right:8px}
        .badge-section.primaire{background:rgba(93,173,226,0.15);color:#5dade2}
        .badge-section.maternelle{background:rgba(46,204,113,0.15);color:#2ecc71}
        .empty-state{text-align:center;padding:40px 16px;color:rgba(255,255,255,0.2)}
        .loading{text-align:center;padding:40px;color:rgba(255,255,255,0.2)}
        .loading .spinner{width:30px;height:30px;border:3px solid rgba(255,215,0,0.1);border-top-color:#ffd700;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .pagination{display:flex;justify-content:center;gap:4px;margin-top:12px;flex-wrap:wrap}
        .pagination button{padding:4px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;transition:all .2s}
        .pagination button:hover{background:rgba(255,255,255,0.06);color:#fff}
        .pagination button.active{background:#ffd700;color:#1a1a2e;border-color:#ffd700}
        .btn-refresh{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:13px;transition:all .2s}
        .btn-refresh:hover{background:rgba(255,255,255,0.08);color:#fff}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,50,0.95);backdrop-filter:blur(20px);padding:12px 24px;border-radius:12px;border-left:4px solid #2ecc71;font-size:14px;color:#fff;z-index:999;animation:toastIn .4s ease;max-width:90%;text-align:center}
        .toast.error{border-left-color:#e74c3c}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .hidden{display:none}
    </style>
</head>
<body>

<div class="header">
    <h1>🏫 PRIMAIRE & MATERNELLE <span id="totalHeader">(0)</span></h1>
    <div class="sub">Liste complète des élèves</div>
</div>

<div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
    <div class="stat-card"><div class="num blue" id="statPrimaire">0</div><div class="label">Primaire</div></div>
    <div class="stat-card"><div class="num green" id="statMaternelle">0</div><div class="label">Maternelle</div></div>
    <div class="stat-card"><div class="num pink" id="statFilles">0</div><div class="label">Filles</div></div>
    <div class="stat-card"><div class="num" id="statGarcons">0</div><div class="label">Garçons</div></div>
</div>

<div class="filters">
    <input type="text" id="searchInput" placeholder="🔍 Rechercher un élève...">
    <select id="filterEcole">
        <option value="all">📊 Toutes les écoles</option>
    </select>
    <button class="btn-refresh" id="refreshBtn">⟳</button>
</div>

<div id="container">
    <div class="loading"><div class="spinner"></div>Chargement des élèves...</div>
</div>

<div class="pagination" id="pagination"></div>

<div id="toastContainer"></div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs, doc, getDoc } from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
    authDomain: "gesco-67c43.firebaseapp.com",
    projectId: "gesco-67c43",
    storageBucket: "gesco-67c43.firebasestorage.app",
    appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole');
const ECOLET_ID = schoolId ? schoolId.replace(/[^a-zA-Z0-9]/g, '_') : 'default';

let allEleves = [];
let currentPage = 1;
const perPage = 30;

function toast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + (type === 'error' ? 'error' : '');
    el.textContent = msg;
    container.innerHTML = '';
    container.appendChild(el);
    setTimeout(() => { el.remove(); }, 3500);
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

async function chargerEcoles() {
    try {
        const snap = await getDocs(collection(db, "ecoles"));
        const select = document.getElementById('filterEcole');
        const currentVal = select.value;
        select.innerHTML = '<option value="all">📊 Toutes les écoles</option>';
        snap.forEach(d => {
            const data = d.data();
            if (data.masque === true) return;
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = data.nom || d.id;
            select.appendChild(opt);
        });
        if (currentVal && select.querySelector(`option[value="${currentVal}"]`)) {
            select.value = currentVal;
        }
    } catch (e) {
        console.error('Erreur chargement écoles:', e);
    }
}

async function chargerEleves() {
    const container = document.getElementById('container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement des élèves...</div>';
    
    try {
        const ecolesSnap = await getDocs(collection(db, "ecoles"));
        const eleves = [];
        
        for (const ds of ecolesSnap) {
            const ecoleId = ds.id;
            const ecoleData = ds.data();
            if (ecoleData.masque === true) continue;
            const ecoleNom = ecoleData.nom || ecoleId;
            
            // Chargement du primaire
            try {
                const pSnap = await getDocs(collection(db, "ecoles", ecoleId, "primaire_eleves"));
                pSnap.forEach(d => {
                    const data = d.data();
                    if (data.nom && !data.abandon) {
                        eleves.push({
                            id: d.id,
                            ecoleId: ecoleId,
                            ecoleNom: ecoleNom,
                            nom: data.nom || "Inconnu",
                            prenom: data.prenom || "",
                            postnom: data.postnom || "",
                            sexe: data.sexe || "M",
                            classe: data.classe || "Primaire",
                            section: 'primaire',
                            parentCode: data.parentCode || null,
                            dateInscription: data.dateInscription || null
                        });
                    }
                });
            } catch (e) {}
            
            // Chargement de la maternelle
            try {
                const mSnap = await getDocs(collection(db, "ecoles", ecoleId, "maternelle_eleves"));
                mSnap.forEach(d => {
                    const data = d.data();
                    if (data.nom && !data.abandon) {
                        eleves.push({
                            id: d.id,
                            ecoleId: ecoleId,
                            ecoleNom: ecoleNom,
                            nom: data.nom || "Inconnu",
                            prenom: data.prenom || "",
                            postnom: data.postnom || "",
                            sexe: data.sexe || "M",
                            classe: data.classe || "Maternelle",
                            section: 'maternelle',
                            parentCode: data.parentCode || null,
                            dateInscription: data.dateInscription || null
                        });
                    }
                });
            } catch (e) {}
        }
        
        allEleves = eleves;
        afficherEleves();
        mettreAJourStats();
        
    } catch (e) {
        console.error('Erreur:', e);
        container.innerHTML = `<div class="empty-state">❌ Erreur de chargement: ${e.message}</div>`;
        toast('Erreur de chargement', 'error');
    }
}

function afficherEleves() {
    const container = document.getElementById('container');
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const filterEcole = document.getElementById('filterEcole').value;
    
    let filtered = allEleves;
    
    if (filterEcole !== 'all') {
        filtered = filtered.filter(e => e.ecoleId === filterEcole);
    }
    
    if (search) {
        filtered = filtered.filter(e => {
            const nomComplet = `${e.nom} ${e.postnom || ''} ${e.prenom || ''}`.toLowerCase();
            return nomComplet.includes(search);
        });
    }
    
    // Tri par école puis par section
    filtered.sort((a, b) => {
        if (a.ecoleNom !== b.ecoleNom) return a.ecoleNom.localeCompare(b.ecoleNom);
        if (a.section !== b.section) return a.section === 'primaire' ? -1 : 1;
        return a.nom.localeCompare(b.nom);
    });
    
    const totalPages = Math.ceil(filtered.length / perPage);
    if (currentPage > totalPages) currentPage = 1;
    if (currentPage < 1) currentPage = 1;
    
    const start = (currentPage - 1) * perPage;
    const end = Math.min(start + perPage, filtered.length);
    const pageEleves = filtered.slice(start, end);
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">📭 Aucun élève trouvé</div>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    
    // Regroupement par école
    const grouped = {};
    pageEleves.forEach(e => {
        if (!grouped[e.ecoleId]) {
            grouped[e.ecoleId] = { nom: e.ecoleNom, eleves: [] };
        }
        grouped[e.ecoleId].eleves.push(e);
    });
    
    let html = '';
    for (const [ecoleId, data] of Object.entries(grouped)) {
        html += `
            <div class="school-group">
                <div class="school-header">
                    🏫 ${escapeHtml(data.nom)}
                    <span class="badge">${data.eleves.length} élève(s)</span>
                </div>
        `;
        
        // Séparer par section
        const primaire = data.eleves.filter(e => e.section === 'primaire');
        const maternelle = data.eleves.filter(e => e.section === 'maternelle');
        
        if (primaire.length > 0) {
            html += `<div class="section-title">📚 PRIMAIRE (${primaire.length})</div>`;
            primaire.forEach(e => {
                html += renderEleve(e);
            });
        }
        
        if (maternelle.length > 0) {
            html += `<div class="section-title">🧸 MATERNELLE (${maternelle.length})</div>`;
            maternelle.forEach(e => {
                html += renderEleve(e);
            });
        }
        
        html += `</div>`;
    }
    
    container.innerHTML = html;
    afficherPagination(filtered.length, totalPages);
}

function renderEleve(e) {
    const nomComplet = `${e.nom} ${e.postnom || ''} ${e.prenom || ''}`.trim();
    const sectionBadge = e.section === 'primaire' 
        ? '<span class="badge-section primaire">PRIMAIRE</span>' 
        : '<span class="badge-section maternelle">MATERNELLE</span>';
    const codeDisplay = e.parentCode ? `<span class="code">${escapeHtml(e.parentCode)}</span>` : '<span class="code" style="color:rgba(255,255,255,0.15);">---</span>';
    
    return `
        <div class="eleve-item">
            <div>
                <span class="nom">${escapeHtml(nomComplet)}</span>
                <span class="classe">${escapeHtml(e.classe)}</span>
                ${sectionBadge}
            </div>
            <div>
                ${codeDisplay}
            </div>
        </div>
    `;
}

function afficherPagination(total, totalPages) {
    const container = document.getElementById('pagination');
    if (totalPages <= 1) {
        container.innerHTML = '';
        return;
    }
    
    let html = '';
    if (currentPage > 1) {
        html += `<button data-page="${currentPage - 1}">◀</button>`;
    }
    
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    if (startPage > 1) {
        html += `<button data-page="1">1</button>`;
        if (startPage > 2) html += `<button disabled>…</button>`;
    }
    
    for (let i = startPage; i <= endPage; i++) {
        html += `<button data-page="${i}" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
    }
    
    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<button disabled>…</button>`;
        html += `<button data-page="${totalPages}">${totalPages}</button>`;
    }
    
    if (currentPage < totalPages) {
        html += `<button data-page="${currentPage + 1}">▶</button>`;
    }
    
    container.innerHTML = html;
    container.querySelectorAll('button[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
            currentPage = parseInt(btn.dataset.page);
            afficherEleves();
        });
    });
}

function mettreAJourStats() {
    const total = allEleves.length;
    const primaire = allEleves.filter(e => e.section === 'primaire').length;
    const maternelle = allEleves.filter(e => e.section === 'maternelle').length;
    const filles = allEleves.filter(e => e.sexe === 'F').length;
    const garcons = allEleves.filter(e => e.sexe === 'M').length;
    
    document.getElementById('totalHeader').textContent = `(${total})`;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPrimaire').textContent = primaire;
    document.getElementById('statMaternelle').textContent = maternelle;
    document.getElementById('statFilles').textContent = filles;
    document.getElementById('statGarcons').textContent = garcons;
}

document.getElementById('searchInput').addEventListener('input', () => {
    currentPage = 1;
    afficherEleves();
});

document.getElementById('filterEcole').addEventListener('change', () => {
    currentPage = 1;
    afficherEleves();
});

document.getElementById('refreshBtn').addEventListener('click', () => {
    toast('🔄 Rafraîchissement...', 'success');
    chargerEleves();
});

// Initialisation
async function init() {
    await chargerEcoles();
    await chargerEleves();
}

init();
console.log('✅ ESPACE PRIMAIRE & MATERNELLE');
</script>
</body>
</html>
